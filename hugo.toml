  # Avisos del inicio: enlace de una Google Sheet compartida como "Cualquier persona con el enlace: Lector"
  # (el enlace normal de compartir; no hace falta "Publicar en la web"). Configuración regional de la hoja: Colombia.
  # Columnas: Mensaje, Tipo (Info | Importante | Urgente), Desde y Hasta (opcionales; sin "Hasta" el aviso queda
  # publicado hasta que lo borren). Fechas DD/MM/AAAA o AAAA-MM-DD.
  # Orden: Urgente, Importante, Info; dentro de cada tipo, la fila más abajo (la más reciente) primero.
  # Se ven 3 y el resto tras el botón "Ver más avisos (n)". Vacío = no se muestra la franja de avisos.
  avisosHojaUrl = ''

  # Horario de atención de la administración para el indicador "Abierto ahora" (hora de Colombia).
  # dias: 1 = lunes … 7 = domingo. Debe coincidir con el texto de "horario".
  # Los festivos de Colombia se marcan como cerrado (cálculo en layouts/index.html: fijos, Ley Emiliani y Pascua).
  [[params.horarioAtencion]]
    dias = [1, 2, 3, 4, 5]
    franjas = [["09:00", "13:00"], ["14:00", "17:00"]]
  [[params.horarioAtencion]]
    dias = [6]
    franjas = [["09:00", "13:00"]]

