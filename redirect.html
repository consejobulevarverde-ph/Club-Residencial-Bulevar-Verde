<!DOCTYPE html>
<html lang="es-CO">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="refresh" content="0; url=https://bulevar-verde-app.web.app/">
    <title>Redirigiendo - Club Residencial Bulevar Verde</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #2c5f2d 0%, #4a8c4b 100%);
            color: #ffffff;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
        }
        
        .redirect-container {
            text-align: center;
            background: rgba(255, 255, 255, 0.95);
            color: #2c5f2d;
            padding: 60px 40px;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            max-width: 600px;
            animation: fadeIn 0.5s ease-in;
        }
        
        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(-20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        
        .icon {
            font-size: 80px;
            margin-bottom: 20px;
            animation: pulse 1.5s infinite;
        }
        
        @keyframes pulse {
            0%, 100% {
                transform: scale(1);
            }
            50% {
                transform: scale(1.1);
            }
        }
        
        h1 {
            font-size: 32px;
            margin-bottom: 20px;
            color: #2c5f2d;
            font-weight: 700;
        }
        
        p {
            font-size: 18px;
            margin-bottom: 15px;
            line-height: 1.6;
            color: #555;
        }
        
        .new-url {
            background: #e8f5e9;
            padding: 15px 20px;
            border-radius: 10px;
            margin: 25px 0;
            border-left: 4px solid #2c5f2d;
        }
        
        .new-url strong {
            color: #2c5f2d;
            font-size: 16px;
            display: block;
            margin-bottom: 8px;
        }
        
        .new-url a {
            color: #4a8c4b;
            text-decoration: none;
            font-weight: 600;
            word-break: break-all;
        }
        
        .new-url a:hover {
            text-decoration: underline;
        }
        
        .loading {
            display: inline-block;
            width: 50px;
            height: 50px;
            border: 5px solid #e8f5e9;
            border-top: 5px solid #2c5f2d;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-top: 20px;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        .manual-link {
            margin-top: 30px;
        }
        
        .btn-redirect {
            display: inline-block;
            background: #2c5f2d;
            color: white;
            padding: 15px 40px;
            border-radius: 50px;
            text-decoration: none;
            font-weight: 600;
            font-size: 18px;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(44, 95, 45, 0.3);
        }
        
        .btn-redirect:hover {
            background: #4a8c4b;
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(44, 95, 45, 0.4);
        }
        
        @media (max-width: 768px) {
            .redirect-container {
                padding: 40px 25px;
            }
            
            h1 {
                font-size: 24px;
            }
            
            p {
                font-size: 16px;
            }
            
            .icon {
                font-size: 60px;
            }
        }
    </style>
    <script>
        // JavaScript redirect como fallback
        setTimeout(function() {
            window.location.href = 'https://bulevar-verde-app.web.app/';
        }, 100);
    </script>
</head>
<body>
    <div class="redirect-container">
        <div class="icon">🏡</div>
        <h1>Sitio Web Movido</h1>
        <p>
            El sitio web del <strong>Club Residencial Bulevar Verde</strong> 
            se ha trasladado a una nueva ubicación.
        </p>
        
        <div class="new-url">
            <strong>Nueva dirección:</strong>
            <a href="https://bulevar-verde-app.web.app/">
                https://bulevar-verde-app.web.app
            </a>
        </div>
        
        <p>Serás redirigido automáticamente en un momento...</p>
        
        <div class="loading"></div>
        
        <div class="manual-link">
            <p style="font-size: 14px; color: #888; margin-bottom: 15px;">
                ¿No fuiste redirigido automáticamente?
            </p>
            <a href="https://bulevar-verde-app.web.app/" class="btn-redirect">
                Ir al Nuevo Sitio
            </a>
        </div>
    </div>
</body>
</html>
