# Allanamiento: el residente acepta los cargos y la sanción propuesta con 50% de
# descuento, sin aprobación del Consejo y renunciando a la apelación (estado terminal).
mutation AplicarAllanamientoCasoConvivenciaAdmin(
  $id: UUID!
  $resolucion: String!
)
@auth(level: NO_ACCESS)
@transaction {
  caso_convivencia_update(
    id: $id
    data: { estado: "SANCION_APROBADA_ALLANAMIENTO", resolucion: $resolucion }
  )
}
