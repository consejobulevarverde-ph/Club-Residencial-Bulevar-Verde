# Operaciones de casos de convivencia (creación, listado, proceso sancionatorio,
# descargos/apelación del residente y evidencias). La autenticación y autorización
# las hace bulevar-verde-api (rol Firebase para vigilancia/administración, token
# de sesión de residente para consulta/descargos/apelación) — por eso todas
# quedan en NO_ACCESS y se invocan con executeAdminQuery/executeAdminMutation.

query ObtenerCasoConvivenciaPorClientRequestIdAdmin(
  $clientRequestId: String!
)
@auth(level: NO_ACCESS) {
  casos_convivencia(where: { clientRequestId: { eq: $clientRequestId } }, limit: 1) {
    id
    caseCode
    apartamento
    motivo
    estado
    registro
    registroVersion
  }
}

mutation CrearCasoConvivenciaAdmin(
  $input: CasoConvivencia_Data!
    @allow(
      fields: """
        caseCode
        unidadId
        apartamento
        motivo
        descripcion
        razonNotificacion
        severidad
        sancionEquivalente
        notificadorAdmin
        creadoPorUid
        requiereProcesoFormal
        clientRequestId
        registro
      """
    )
)
@auth(level: NO_ACCESS)
@transaction {
  caso_convivencia_insert(data: $input)
}

mutation CrearEvidenciaConvivenciaAdmin(
  $input: EvidenciaConvivencia_Data!
    @allow(
      fields: """
        casoId
        contexto
        url
        driveFileId
        nombreArchivo
        mimeType
        tamanoBytes
        almacenamiento
        objetoRuta
      """
    )
)
@auth(level: NO_ACCESS)
@transaction {
  evidencia_convivencia_insert(data: $input)
}

# OJO: "in"/"eq" NO toleran null como "sin filtro" (a diferencia de lo que asumía una
# versión anterior de este comentario) — probado contra el emulador, un $severidad nulo
# con "eq" (o un $estados nulo con "in") devuelve cero filas, no "todas". Por eso, igual
# que $estados (que ya enumeraba todos los ESTADOS_CASO_CONVIVENCIA en vez de pasar null),
# $severidades ahora es un array no nulo y la API pasa todas las SEVERIDADES_CONVIVENCIA
# cuando no se filtra por severidad. $apartamentoContiene/$motivoContiene usan "contains"
# (mismo operador que ya usa buscar_unidades.gql), que tampoco tolera null (falla con
# "$apartamentoContiene is null") — por eso son String! y la API pasa "" cuando no se
# filtra: toda cadena "contains" la cadena vacía, así que equivale a no filtrar.
query ListarCasosConvivenciaAdmin(
  $estados: [String!]!
  $severidades: [String!]!
  $apartamentoContiene: String!
  $motivoContiene: String!
  $limit: Int!
  $offset: Int!
)
@auth(level: NO_ACCESS) {
  casos_convivencia(
    where: {
      estado: { in: $estados }
      severidad: { in: $severidades }
      apartamento: { contains: $apartamentoContiene }
      motivo: { contains: $motivoContiene }
    }
    orderBy: [{ fechaCreacion: DESC }]
    limit: $limit
    offset: $offset
  ) {
    id
    caseCode
    apartamento
    motivo
    severidad
    requiereProcesoFormal
    estado
    fechaCreacion
    descargosResidente
    # Solo para saber si hay adjuntos (cualquier contexto) — basta con una fila.
    evidencias: evidencias_convivencia_on_caso(limit: 1) {
      id
    }
  }
}

# Igual que ListarCasosConvivenciaAdmin, filtrando por registro (administración ve también los
# borradores "Pendiente de completar y notificar"; el comité solo FINALIZADO). Operación nueva
# para no cambiar la firma de la anterior mientras convive con la versión desplegada de la API.
query ListarCasosConvivenciaPorRegistroAdmin(
  $estados: [String!]!
  $severidades: [String!]!
  $apartamentoContiene: String!
  $motivoContiene: String!
  $registros: [String!]!
  $limit: Int!
  $offset: Int!
)
@auth(level: NO_ACCESS) {
  casos_convivencia(
    where: {
      registro: { in: $registros }
      estado: { in: $estados }
      severidad: { in: $severidades }
      apartamento: { contains: $apartamentoContiene }
      motivo: { contains: $motivoContiene }
    }
    orderBy: [{ fechaCreacion: DESC }]
    limit: $limit
    offset: $offset
  ) {
    id
    caseCode
    apartamento
    motivo
    severidad
    requiereProcesoFormal
    estado
    registro
    fechaCreacion
    descargosResidente
    # Solo para saber si hay adjuntos (cualquier contexto) — basta con una fila.
    evidencias: evidencias_convivencia_on_caso(limit: 1) {
      id
    }
  }
}

query ObtenerCasoConvivenciaDetalleAdmin(
  $id: UUID!
)
@auth(level: NO_ACCESS) {
  caso_convivencia(id: $id) {
    id
    caseCode
    unidad {
      id
    }
    apartamento
    motivo
    descripcion
    razonNotificacion
    severidad
    sancionEquivalente
    notificadorAdmin
    creadoPorUid
    requiereProcesoFormal
    estado
    descargosResidente
    fechaDescargos
    actaComiteFecha
    actaComiteResumen
    sancionPropuestaTipo
    sancionPropuestaValor
    sancionPropuestaJustificacion
    sancionPropuestaPersona {
      id
      nombreCompleto
    }
    apelacionTexto
    fechaApelacion
    resolucion
    notasAdmin
    clientRequestId
    registro
    registroVersion
    fechaFinalizacion
    finalizadoPorUid
    fechaCreacion
    fechaActualizacion
    evidencias: evidencias_convivencia_on_caso {
      id
      contexto
      url
      nombreArchivo
      mimeType
      tamanoBytes
      almacenamiento
      fechaCreacion
    }
    adjuntos: adjuntos_convivencia_on_caso(orderBy: [{ fechaCreacion: ASC }]) {
      id
      contexto
      estado
      nombreOriginal
      mimeType
      tamanoBytes
      motivo
      fechaActualizacion
    }
    notificaciones: notificaciones_caso_convivencia_on_caso {
      tipo
      estado
      intentos
      destinatarios
      aceptados
      rechazados
      ultimoError
      fechaEnvio
      fechaActualizacion
    }
    sancion: sanciones_on_caso {
      id
      tipoSancion
      descripcion
      valor
      estado
      fechaImposicion
      fechaPago
      fechaCierre
      observaciones
    }
    eventos: eventos_caso_convivencia_on_caso(orderBy: [{ fechaCreacion: ASC }]) {
      id
      tipoEvento
      estadoAnterior
      estadoNuevo
      descripcion
      actorUid
      actorTipo
      fechaCreacion
    }
  }
}

# Casos que quien los creó todavía puede corregir: siguen en PENDIENTE_DESCARGOS y se
# finalizaron desde $desde (la API pasa "ahora - ventana de corrección"; los casos
# anteriores al registro progresivo no tienen fechaFinalizacion y cuentan desde su
# creación). Incluye además sus borradores, sin límite de tiempo, para completarlos.
# Devuelve los campos narrativos completos para precargar el formulario de corrección de
# vigilancia, que no tiene acceso al detalle administrativo del caso.
query ListarCasosPropiosCorregiblesAdmin(
  $creadoPorUid: String!
  $desde: Timestamp!
)
@auth(level: NO_ACCESS) {
  casos_convivencia(
    where: {
      _and: [
        { creadoPorUid: { eq: $creadoPorUid } }
        { estado: { eq: "PENDIENTE_DESCARGOS" } }
        {
          _or: [
            { registro: { eq: "BORRADOR" } }
            { fechaFinalizacion: { ge: $desde } }
            { _and: [{ fechaFinalizacion: { isNull: true } }, { fechaCreacion: { ge: $desde } }] }
          ]
        }
      ]
    }
    orderBy: [{ fechaCreacion: DESC }]
  ) {
    id
    caseCode
    apartamento
    motivo
    descripcion
    razonNotificacion
    notificadorAdmin
    severidad
    registro
    fechaCreacion
    fechaFinalizacion
    evidencias: evidencias_convivencia_on_caso(where: { contexto: { eq: "CASO" } }) {
      id
      contexto
    }
  }
}

# Restringida en la capa API a estado destino CERRADO_SIN_SANCION | ARCHIVADO,
# solo desde PENDIENTE_DESCARGOS | CON_DESCARGOS. El resto de transiciones usan
# las mutaciones dedicadas de más abajo.
mutation ActualizarEstadoCasoConvivenciaAdmin(
  $id: UUID!
  $estado: String!
  $resolucion: String
  $notasAdmin: String
  $resueltoPorUid: String
)
@auth(level: NO_ACCESS)
@transaction {
  caso_convivencia_update(
    id: $id
    data: {
      estado: $estado
      resolucion: $resolucion
      notasAdmin: $notasAdmin
      resueltoPorUid: $resueltoPorUid
    }
  )
}

