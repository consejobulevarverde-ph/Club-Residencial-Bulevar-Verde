# Operaciones de casos de convivencia (creación, listado, proceso sancionatorio,
# descargos/apelación del residente y evidencias). La autenticación y autorización
# las hace bulevar-verde-api (rol Firebase para vigilancia/administración, token
# de sesión de residente para consulta/descargos/apelación) — por eso todas
# quedan en NO_ACCESS y se invocan con executeAdminQuery/executeAdminMutation.

query ObtenerCasoConvivenciaPorClientRequestIdAdmin(
  $clientRequestId: String!
)
@auth(level: NO_ACCESS) {
  casos_convivencia(where: { clientRequestId: { eq: $clientRequestId } }, limit: 1) {
    id
    caseCode
    apartamento
    motivo
    estado
    registro
    registroVersion
  }
}

mutation CrearCasoConvivenciaAdmin(
  $input: CasoConvivencia_Data!
    @allow(
      fields: """
        caseCode
        unidadId
        apartamento
        motivo
        descripcion
        razonNotificacion
        severidad
        sancionEquivalente
        notificadorAdmin
        creadoPorUid
        requiereProcesoFormal
        clientRequestId
        registro
      """
    )
)
@auth(level: NO_ACCESS)
@transaction {
  caso_convivencia_insert(data: $input)
}

mutation CrearEvidenciaConvivenciaAdmin(
  $input: EvidenciaConvivencia_Data!
    @allow(
      fields: """
        casoId
        contexto
        url
        driveFileId
        nombreArchivo
        mimeType
        tamanoBytes
        almacenamiento
        objetoRuta
      """
    )
)
@auth(level: NO_ACCESS)
@transaction {
  evidencia_convivencia_insert(data: $input)
}

# OJO: "in"/"eq" NO toleran null como "sin filtro" (a diferencia de lo que asumía una
# versión anterior de este comentario) — probado contra el emulador, un $severidad nulo
# con "eq" (o un $estados nulo con "in") devuelve cero filas, no "todas". Por eso, igual
# que $estados (que ya enumeraba todos los ESTADOS_CASO_CONVIVENCIA en vez de pasar null),
# $severidades ahora es un array no nulo y la API pasa todas las SEVERIDADES_CONVIVENCIA
# cuando no se filtra por severidad. $apartamentoContiene/$motivoContiene usan "contains"
# (mismo operador que ya usa buscar_unidades.gql), que tampoco tolera null (falla con
# "$apartamentoContiene is null") — por eso son String! y la API pasa "" cuando no se
# filtra: toda cadena "contains" la cadena vacía, así que equivale a no filtrar.
query ListarCasosConvivenciaAdmin(
  $estados: [String!]!
  $severidades: [String!]!
  $apartamentoContiene: String!
  $motivoContiene: String!
  $limit: Int!
  $offset: Int!
)
@auth(level: NO_ACCESS) {
  casos_convivencia(
    where: {
      estado: { in: $estados }
      severidad: { in: $severidades }
      apartamento: { contains: $apartamentoContiene }
      motivo: { contains: $motivoContiene }
    }
    orderBy: [{ fechaCreacion: DESC }]
    limit: $limit
    offset: $offset
  ) {
    id
    caseCode
    apartamento
    motivo
    severidad
    requiereProcesoFormal
    estado
    fechaCreacion
    descargosResidente
    # Solo para saber si hay adjuntos (cualquier contexto) — basta con una fila.
    evidencias: evidencias_convivencia_on_caso(limit: 1) {
      id
    }
  }
}

# Igual que ListarCasosConvivenciaAdmin, filtrando por registro (administración ve también los
# borradores "Pendiente de completar y notificar"; el comité solo FINALIZADO). Operación nueva
# para no cambiar la firma de la anterior mientras convive con la versión desplegada de la API.
query ListarCasosConvivenciaPorRegistroAdmin(
  $estados: [String!]!
  $severidades: [String!]!
  $apartamentoContiene: String!
  $motivoContiene: String!
  $registros: [String!]!
  $limit: Int!
  $offset: Int!
)
@auth(level: NO_ACCESS) {
  casos_convivencia(
    where: {
      registro: { in: $registros }
      estado: { in: $estados }
      severidad: { in: $severidades }
      apartamento: { contains: $apartamentoContiene }
      motivo: { contains: $motivoContiene }
    }
    orderBy: [{ fechaCreacion: DESC }]
    limit: $limit
    offset: $offset
  ) {
    id
    caseCode
    apartamento
    motivo
    severidad
    requiereProcesoFormal
    estado
    registro
    fechaCreacion
    descargosResidente
    # Solo para saber si hay adjuntos (cualquier contexto) — basta con una fila.
    evidencias: evidencias_convivencia_on_caso(limit: 1) {
      id
    }
  }
}

# Igual que ListarCasosConvivenciaPorRegistroAdmin, filtrando además por remisión a órganos de
# gobierno (administración envía [true, false] en ambos; el comité y el consejo solo [true] en el
# suyo). Operación nueva para no cambiar la firma de la anterior mientras convive con la API desplegada.
query ListarCasosConvivenciaPorRemisionAdmin(
  $estados: [String!]!
  $severidades: [String!]!
  $apartamentoContiene: String!
  $motivoContiene: String!
  $registros: [String!]!
  $remitidoComite: [Boolean!]!
  $remitidoConsejo: [Boolean!]!
  $limit: Int!
  $offset: Int!
)
@auth(level: NO_ACCESS) {
  casos_convivencia(
    where: {
      registro: { in: $registros }
      estado: { in: $estados }
      severidad: { in: $severidades }
      apartamento: { contains: $apartamentoContiene }
      motivo: { contains: $motivoContiene }
      remitidoComite: { in: $remitidoComite }
      remitidoConsejo: { in: $remitidoConsejo }
    }
    orderBy: [{ fechaCreacion: DESC }]
    limit: $limit
    offset: $offset
  ) {
    id
    caseCode
    apartamento
    motivo
    severidad
    requiereProcesoFormal
    estado
    registro
    remitidoComite
    remitidoConsejo
    evidenciaOculta
    pendienteNotificar
    fechaCreacion
    descargosResidente
    # Solo para saber si hay adjuntos (cualquier contexto) — basta con una fila.
    evidencias: evidencias_convivencia_on_caso(limit: 1) {
      id
    }
  }
}

