# Casos que quien los creó todavía puede corregir: siguen en PENDIENTE_DESCARGOS y se
# finalizaron desde $desde (la API pasa "ahora - ventana de corrección"; los casos
# anteriores al registro progresivo no tienen fechaFinalizacion y cuentan desde su
# creación). Incluye además sus borradores, sin límite de tiempo, para completarlos.
# Devuelve los campos narrativos completos para precargar el formulario de corrección de
# vigilancia, que no tiene acceso al detalle administrativo del caso.
query ListarCasosPropiosCorregiblesAdmin(
  $creadoPorUid: String!
  $desde: Timestamp!
)
@auth(level: NO_ACCESS) {
  casos_convivencia(
    where: {
      _and: [
        { creadoPorUid: { eq: $creadoPorUid } }
        { estado: { eq: "PENDIENTE_DESCARGOS" } }
        {
          _or: [
            { registro: { eq: "BORRADOR" } }
            { fechaFinalizacion: { ge: $desde } }
            { _and: [{ fechaFinalizacion: { isNull: true } }, { fechaCreacion: { ge: $desde } }] }
          ]
        }
      ]
    }
    orderBy: [{ fechaCreacion: DESC }]
  ) {
    id
    caseCode
    apartamento
    motivo
    descripcion
    razonNotificacion
    notificadorAdmin
    severidad
    registro
    fechaCreacion
    fechaFinalizacion
    evidencias: evidencias_convivencia_on_caso(where: { contexto: { eq: "CASO" } }) {
      id
      contexto
    }
  }
}

# Restringida en la capa API a estado destino CERRADO_SIN_SANCION | ARCHIVADO,
