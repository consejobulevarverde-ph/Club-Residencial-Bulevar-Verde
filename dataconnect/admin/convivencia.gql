      id
      caseCode
      apartamento
      motivo
      descripcion
      razonNotificacion
      severidad
      sancionEquivalente
      notificadorAdmin
      estado
      descargosResidente
      fechaDescargos
      actaComiteFecha
      actaComiteResumen
      sancionPropuestaTipo
      sancionPropuestaValor
      sancionPropuestaJustificacion
      sancionPropuestaPersona {
        id
      }
      apelacionTexto
      fechaApelacion
      resolucion
      fechaCreacion
      evidenciaOculta
      fechaLecturaResidente
      evidencias: evidencias_convivencia_on_caso {
        id
        contexto
        url
        nombreArchivo
        mimeType
        tamanoBytes
