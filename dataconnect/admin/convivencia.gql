# --- Consulta y acciones del propio residente (autorización por unidadId, no por apto declarado por el cliente) ---

query ListarCasosConvivenciaPorUnidadAdmin(
  $unidadId: UUID!
  $limit: Int!
  $offset: Int!
)
@auth(level: NO_ACCESS) {
  unidad(id: $unidadId) {
    casos: casos_convivencia_on_unidad(
      orderBy: [{ fechaCreacion: DESC }]
      limit: $limit
      offset: $offset
    ) {
      id
      caseCode
      apartamento
      motivo
      estado
      fechaCreacion
      descargosResidente
    }
  }
}

query ListarCasosConvivenciaResumenPorUnidadAdmin(
  $unidadId: UUID!
)
@auth(level: NO_ACCESS) {
  unidad(id: $unidadId) {
    casos: casos_convivencia_on_unidad(
      orderBy: [{ fechaCreacion: DESC }]
      limit: 100
    ) {
      caseCode
      motivo
      severidad
      estado
      fechaCreacion
    }
  }
}

query ObtenerCasoConvivenciaResidenteAdmin(
  $unidadId: UUID!
  $caseCode: String!
)
@auth(level: NO_ACCESS) {
  unidad(id: $unidadId) {
    casos: casos_convivencia_on_unidad(where: { caseCode: { eq: $caseCode } }, limit: 1) {
      id
      caseCode
      apartamento
      motivo
      descripcion
      razonNotificacion
      severidad
      sancionEquivalente
      notificadorAdmin
      estado
      descargosResidente
      fechaDescargos
      actaComiteFecha
      actaComiteResumen
      sancionPropuestaTipo
      sancionPropuestaValor
      sancionPropuestaJustificacion
      apelacionTexto
      fechaApelacion
      resolucion
      fechaCreacion
      evidencias: evidencias_convivencia_on_caso {
        id
        contexto
        url
        nombreArchivo
      }
      sancion: sanciones_on_caso {
        id
        tipoSancion
        valor
        estado
        fechaImposicion
      }
      eventos: eventos_caso_convivencia_on_caso(orderBy: [{ fechaCreacion: ASC }]) {
        id
        tipoEvento
        estadoAnterior
        estadoNuevo
        descripcion
        fechaCreacion
      }
    }
  }
}

mutation GuardarDescargosCasoConvivenciaAdmin(
