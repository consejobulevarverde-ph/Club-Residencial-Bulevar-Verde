# Obtiene el mapa codigoOficial -> UUID de las unidades ya creadas.
# Tambien trae torre y apartamento para matching por apartamento en importaciones nuevas.
query ObtenerMapaUnidadesImportacion(
  $limit: Int!
  $offset: Int!
)
@auth(level: NO_ACCESS) {
  unidades(
    limit: $limit
    offset: $offset
  ) {
    id
    codigoOficial
    torre
    apartamento
  }
}
