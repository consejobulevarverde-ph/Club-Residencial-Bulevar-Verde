# Queries y mutations para gestión de cartera
# Consolidado en HistorialCartera con restricción de uniqueness en (unidad, periodo)

# Buscar unidad por código para obtener historial de cartera
query ObtenerUnidadPorCodigoCartera($codigoOficial: String!) @auth(level: NO_ACCESS) {
  unidades(where: { codigoOficial: { eq: $codigoOficial } }) {
    id
    codigoOficial
  }
}

# Obtener registro de cartera para un período específico
query ObtenerHistorialCarteraPorPeriodo(
  $unidadId: UUID!
  $periodo: String!
) @auth(level: NO_ACCESS) {
  historial_carteras(
    where: {
      unidad: { id: { eq: $unidadId } }
      periodo: { eq: $periodo }
    }
  ) {
    id
    unidad {
      id
    }
    periodo
  }
}

# Crear o actualizar historial de cartera (upsert)
# Solo se debe tener un registro por unidad por período
mutation CrearOActualizarHistorialCartera(
  $id: UUID
  $unidadKey: Unidad_Key!
  $periodo: String!
  $fechaCorte: Date
  $saldoAnterior: Float
  $saldoActual: Float
  $cargos: Float
  $estadoCuenta: String
  $elegibleReservas: Boolean
) @auth(level: NO_ACCESS) {
  historial_cartera_upsert(
    data: {
      id: $id
      unidad: $unidadKey
      periodo: $periodo
      fechaCorte: $fechaCorte
      saldoAnterior: $saldoAnterior
      saldoActual: $saldoActual
      cargos: $cargos
      estadoCuenta: $estadoCuenta
      elegibleReservas: $elegibleReservas
    }
  )
}
