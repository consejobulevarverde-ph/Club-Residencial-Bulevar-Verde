}

mutation RetirarVinculoVehiculoUnidadAdmin(
  $id: UUID!
  $vigenteHasta: Timestamp!
)
@auth(level: NO_ACCESS)
@transaction {
  vinculo_vehiculo_unidad_updateMany(
    where: { id: { eq: $id } }
    data: { esActual: false, estadoVinculo: "RETIRADO", vigenteHasta: $vigenteHasta }
  )
}

