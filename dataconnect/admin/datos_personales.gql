# Operaciones de servicio (sin impersonación de Firebase) para el portal de
# autoservicio de residentes ("Mis datos personales"). La autenticación y
# autorización de estas operaciones las hace bulevar-verde-api con su propio
# token de sesión firmado, no Firebase Auth ni los niveles @auth de
# Data Connect — por eso todas quedan en NO_ACCESS y se invocan con
# executeAdminQuery/executeAdminMutation.

query ObtenerUnidadPorApartamentoAdmin(
  $apartamento: String!
)
@auth(level: NO_ACCESS) {
  unidades(where: { apartamento: { eq: $apartamento } }, limit: 5) {
    id
    torre
    apartamento
    codigoOficial
    areaPrivada
    coeficiente
    presupuestoAnual
    estadoUnidad
    fechaEntrega
  }
}

query ObtenerPerfilUnidadAdmin(
  $id: UUID!
)
@auth(level: NO_ACCESS) {
  unidad(id: $id) {
    id
    torre
    apartamento
    codigoOficial
    areaPrivada
    coeficiente
    presupuestoAnual
    fechaEntrega
    estadoUnidad
    activo
    vinculosPersona: vinculos_unidad_persona_on_unidad(where: { activo: { eq: true } }) {
      id
      tipoRelacion
      fechaInicio
      fechaFin
      activo
      persona {
        id
        tipoDocumento
        numeroDocumento
        nombreCompleto
        correo
        telefono
        activo
      }
    }
    vinculosVehiculo: vinculos_vehiculo_unidad_on_unidad(where: { esActual: { eq: true } }) {
      id
      tipoVinculo
      estadoVinculo
      vehiculo {
        id
        placa
        tipoVehiculo
      }
    }
    parqueaderos: parqueaderos_on_unidad {
      codigo
      tipoParqueadero
    }
    mascotas: mascotas_on_unidad(where: { activo: { eq: true } }) {
      id
      nombre
      especie
      raza
    }
    emergencia: contactos_emergencia_on_unidad(where: { activo: { eq: true } }) {
      id
      nombre
      parentesco
      telefono
    }
    historialCartera: historial_carteras_on_unidad(orderBy: { periodo: DESC }, limit: 1) {
      id
      periodo
      fechaCorte
      saldoAnterior
      saldoActual
      cargos
      estadoCuenta
      elegibleReservas
      fechaActualizacion
    }
  }
}

mutation ActualizarPersonaContactoAdmin(
  $id: UUID!
  $correo: String
  $telefono: String
)
@auth(level: NO_ACCESS)
@transaction {
  persona_update(id: $id, data: { correo: $correo, telefono: $telefono })
}

mutation ActualizarDatosPersonaAdmin(
  $id: UUID!
  $tipoDocumento: String!
  $numeroDocumento: String!
  $nombreCompleto: String!
)
@auth(level: NO_ACCESS)
@transaction {
  persona_update(
    id: $id
    data: { tipoDocumento: $tipoDocumento, numeroDocumento: $numeroDocumento, nombreCompleto: $nombreCompleto }
  )
}

mutation ActualizarRolVinculoAdmin(
  $id: UUID!
  $tipoRelacion: String!
)
@auth(level: NO_ACCESS)
@transaction {
  vinculo_unidad_persona_update(id: $id, data: { tipoRelacion: $tipoRelacion })
}

mutation CrearPersonaAdmin(
  $input: Persona_Data!
    @allow(
      fields: """
        tipoDocumento
        numeroDocumento
        nombreCompleto
        correo
        telefono
        activo
      """
    )
)
@auth(level: NO_ACCESS)
@transaction {
  persona_insert(data: $input)
}

mutation CrearVinculoUnidadPersonaAdmin(
  $input: VinculoUnidadPersona_Data!
    @allow(
      fields: """
        personaId
        unidadId
        tipoRelacion
        fechaInicio
        activo
      """
    )
)
@auth(level: NO_ACCESS)
@transaction {
  vinculo_unidad_persona_insert(data: $input)
}

mutation RetirarVinculoUnidadPersonaAdmin(
  $id: UUID!
  $fechaFin: Date!
)
@auth(level: NO_ACCESS)
@transaction {
  vinculo_unidad_persona_updateMany(
    where: { id: { eq: $id } }
    data: { activo: false, fechaFin: $fechaFin }
  )
}

query BuscarVehiculoPorPlacaAdmin(
  $placa: String!
)
@auth(level: NO_ACCESS) {
  vehiculos(where: { placa: { eq: $placa } }, limit: 1) {
    id
  }
}

