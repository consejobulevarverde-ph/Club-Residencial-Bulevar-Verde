# Operaciones para el rol vigilancia: búsqueda y perfil restringidos
# (sin correo, documento, coeficiente ni estado de cuenta) y registro
# de residente principal, equivalente a "buscarVigilancia" y
# "registrarResidenteVigilancia" de Apps Script.

query BuscarVigilancia(
  $termino: String!
)
@auth(level: USER, insecureReason: "La API restringe este endpoint al rol vigilancia antes de invocar la consulta.") {
  porCodigoUnidad: unidades(where: { codigoOficial: { contains: $termino } }) {
    id
    codigoOficial
  }
  porPlaca: vehiculos(where: { placa: { contains: $termino } }) {
    placa
    vinculos: vinculos_vehiculo_unidad_on_vehiculo(where: { esActual: { eq: true } }) {
      unidad {
        id
        codigoOficial
      }
    }
  }
  porParqueadero: parqueaderos(where: { codigo: { contains: $termino } }) {
    codigo
    unidad {
      id
      codigoOficial
    }
  }
}

query ObtenerUnidadPorApartamento(
  $apartamento: String!
)
@auth(level: USER, insecureReason: "La API restringe este endpoint al rol vigilancia antes de invocar la consulta.") {
  unidades(where: { apartamento: { eq: $apartamento } }, limit: 5) {
    id
    codigoOficial
  }
}

query ObtenerPerfilVigilancia(
  $id: UUID!
)
@auth(level: USER, insecureReason: "La API restringe este endpoint al rol vigilancia antes de invocar la consulta.") {
  unidad(id: $id) {
    id
    codigoOficial
    estadoUnidad
    residentes: vinculos_unidad_persona_on_unidad(where: { activo: { eq: true } }) {
      tipoRelacion
      persona {
        nombreCompleto
      }
    }
    vehiculos: vinculos_vehiculo_unidad_on_unidad(where: { esActual: { eq: true } }) {
      tipoVinculo
      vehiculo {
        placa
        tipoVehiculo
      }
    }
    parqueaderos: parqueaderos_on_unidad {
      codigo
      tipoParqueadero
    }
    emergencia: contactos_emergencia_on_unidad(limit: 1) {
      nombre
      parentesco
      telefono
    }
  }
}

mutation RetirarResidentesNoPropietarios(
  $unidadId: UUID!
  $fechaFin: Date!
)
@auth(level: USER, insecureReason: "La API restringe este endpoint al rol vigilancia antes de invocar la mutación.")
@transaction {
  vinculo_unidad_persona_updateMany(
    where: {
      unidadId: { eq: $unidadId }
      activo: { eq: true }
      tipoRelacion: { ne: "PROPIETARIO" }
    }
    data: { activo: false, fechaFin: $fechaFin }
  )
}
