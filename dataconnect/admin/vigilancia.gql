# Operaciones para el rol vigilancia: búsqueda y perfil restringidos
# (sin correo, documento ni coeficiente) y registro de residente principal.
# Se expone el estado general de cartera (sin montos) para que vigilancia
# pueda detectar si una unidad está al día. Equivalente a "buscarVigilancia"
# y "registrarResidenteVigilancia" de Apps Script.

query BuscarVigilancia(
  $termino: String!
)
@auth(level: USER, insecureReason: "La API restringe este endpoint al rol vigilancia antes de invocar la consulta.") {
  porCodigoUnidad: unidades(where: { codigoOficial: { contains: $termino } }) {
    id
    codigoOficial
  }
  porPlaca: vehiculos(where: { placa: { contains: $termino } }) {
    placa
    vinculos: vinculos_vehiculo_unidad_on_vehiculo(where: { esActual: { eq: true } }) {
      unidad {
        id
        codigoOficial
      }
    }
  }
  porParqueadero: parqueaderos(where: { codigo: { contains: $termino } }) {
    codigo
    unidad {
      id
      codigoOficial
    }
  }
}

query ObtenerUnidadPorApartamento(
  $apartamento: String!
)
@auth(level: USER, insecureReason: "La API restringe este endpoint al rol vigilancia antes de invocar la consulta.") {
  unidades(where: { apartamento: { eq: $apartamento } }, limit: 5) {
    id
    codigoOficial
  }
}

query ObtenerPerfilVigilancia(
  $id: UUID!
)
@auth(level: USER, insecureReason: "La API restringe este endpoint al rol vigilancia antes de invocar la consulta.") {
  unidad(id: $id) {
    id
    codigoOficial
    estadoUnidad
    residentes: vinculos_unidad_persona_on_unidad(where: { activo: { eq: true } }) {
      tipoRelacion
      persona {
        id
        nombreCompleto
        correo
      }
    }
    vehiculos: vinculos_vehiculo_unidad_on_unidad(where: { esActual: { eq: true } }) {
      tipoVinculo
      vehiculo {
        placa
        tipoVehiculo
      }
    }
    parqueaderos: parqueaderos_on_unidad {
      codigo
      tipoParqueadero
    }
    emergencia: contactos_emergencia_on_unidad(limit: 1) {
      nombre
      parentesco
      telefono
    }
    historialCartera: historial_carteras_on_unidad(orderBy: { periodo: DESC }, limit: 1) {
      estadoCuenta
    }
  }
}

mutation RetirarResidentesNoPropietarios(
  $unidadId: UUID!
  $fechaFin: Date!
)
@auth(level: USER, insecureReason: "La API restringe este endpoint al rol vigilancia antes de invocar la mutación.")
@transaction {
  vinculo_unidad_persona_updateMany(
    where: {
      unidadId: { eq: $unidadId }
      activo: { eq: true }
      tipoRelacion: { ne: "PROPIETARIO" }
    }
    data: { activo: false, fechaFin: $fechaFin }
  )
}

query BuscarVehiculoPorPlaca(
  $placa: String!
)
@auth(level: USER, insecureReason: "La API restringe este endpoint al rol vigilancia antes de invocar la consulta.") {
  vehiculos(where: { placa: { eq: $placa } }, limit: 1) {
    id
  }
}

mutation CrearVehiculo(
  $input: Vehiculo_Data! @allow(fields: "placa tipoVehiculo estadoVehiculo activo")
)
@auth(level: USER, insecureReason: "La API restringe este endpoint al rol vigilancia antes de invocar la mutación.")
@transaction {
  vehiculo_insert(data: $input)
}

mutation CrearVinculoVehiculoUnidad(
  $input: VinculoVehiculoUnidad_Data! @allow(fields: "vehiculoId unidadId tipoVinculo estadoVinculo esActual vigenteDesde origenRegistro")
)
@auth(level: USER, insecureReason: "La API restringe este endpoint al rol vigilancia antes de invocar la mutación.")
@transaction {
  vinculo_vehiculo_unidad_insert(data: $input)
}

# Contacto de persona (correo/teléfono) para el flujo de "registrar correo
# faltante" desde vigilancia/administración. A diferencia de
# ActualizarPersonaContactoAdmin (NO_ACCESS, usada por el autoservicio de
# residentes con su propio token firmado), estas operaciones son invocadas
# por personal autenticado con Firebase (vigilancia/administrador/superadmin).
query ObtenerPersonaContacto(
  $id: UUID!
)
@auth(level: USER, insecureReason: "La API restringe este endpoint a roles vigilancia/administrador/superadmin antes de invocar la consulta.") {
  persona(id: $id) {
    id
    correo
    telefono
  }
}

mutation ActualizarPersonaContacto(
  $id: UUID!
  $correo: String
  $telefono: String
)
@auth(level: USER, insecureReason: "La API restringe este endpoint a roles vigilancia/administrador/superadmin y valida en Express si el rol puede sobrescribir un correo ya existente.")
@transaction {
  persona_update(id: $id, data: { correo: $correo, telefono: $telefono })
}

query ObtenerColaboradorPorFirebaseUid(
  $firebaseUid: String!
)
@auth(level: USER, insecureReason: "La API pasa el uid del token autenticado (request.auth.uid), no uno arbitrario del cliente.") {
  colaboradores(
    where: { firebaseUid: { eq: $firebaseUid }, activo: { eq: true } }
    limit: 1
  ) {
    id
    nombreCompleto
  }
}
