# Registros del parqueadero de visitantes (vigilancia/lector de placas y pestaña Sanciones).
# NO_ACCESS: la API restringe las rutas a vigilancia/administrador/superadmin y deriva el vigilante
# (uid y nombre) del token, nunca del cliente.

query ObtenerRegistroParqueaderoVisitantePorClientRequestIdAdmin($clientRequestId: String!)
@auth(level: NO_ACCESS) {
  registros_parqueadero_visitante(where: { clientRequestId: { eq: $clientRequestId } }, limit: 1) {
    id
    placa
    tipoVehiculo
    fechaCaptura
    unidad {
      id
      apartamento
      codigoOficial
    }
  }
}

mutation CrearRegistroParqueaderoVisitanteAdmin(
  $input: RegistroParqueaderoVisitante_Data!
    @allow(
      fields: """
        id
        placa
        placaDetectada
        tipoVehiculo
        unidadId
        fotoObjeto
        fotoTamanoBytes
        vigilanteNombre
        registradoPorUid
        fechaCaptura
        vehiculoId
        vinculoId
        unidadOrigenAsignacion
        clientRequestId
      """
    )
)
@auth(level: NO_ACCESS)
@transaction {
  registro_parqueadero_visitante_insert(data: $input)
}

# Unidades con vínculo vigente para una placa exacta (para asignar la unidad del registro). Devuelve
# también el vehículo y el vínculo para congelarlos en el registro: administración los necesita al
# resolver una controversia, incluso si el vínculo se retira después.
query UnidadesVigentesPorPlacaAdmin($placa: String!)
@auth(level: NO_ACCESS) {
  vehiculos(where: { placa: { eq: $placa } }, limit: 1) {
    id
    vinculos: vinculos_vehiculo_unidad_on_vehiculo(where: { esActual: { eq: true } }) {
      id
      unidad {
        id
        apartamento
        codigoOficial
      }
    }
  }
}

# Pestaña Sanciones: registros con fecha de captura en [desde, hasta), más recientes primero.
query ListarRegistrosParqueaderoVisitanteAdmin($desde: Timestamp!, $hasta: Timestamp!, $limite: Int!)
@auth(level: NO_ACCESS) {
  registros_parqueadero_visitante(
    where: { fechaCaptura: { ge: $desde, lt: $hasta } }
    orderBy: [{ fechaCaptura: DESC }]
    limit: $limite
  ) {
    id
    placa
    placaDetectada
    tipoVehiculo
    fechaCaptura
    fotoObjeto
    vigilanteNombre
    fechaPosprocesamiento
    unidadAsignadaPorNombre
    fechaAsignacionUnidad
    unidad {
      id
      apartamento
      codigoOficial
    }
  }
}

query ObtenerRegistroParqueaderoVisitanteAdmin($id: UUID!)
@auth(level: NO_ACCESS) {
  registro_parqueadero_visitante(id: $id) {
    id
    fotoObjeto
    unidad {
      id
    }
  }
}

mutation AsignarUnidadRegistroParqueaderoVisitanteAdmin(
  $id: UUID!
  $unidadId: UUID!
  $asignadaPorUid: String!
  $asignadaPorNombre: String!
)
@auth(level: NO_ACCESS)
@transaction {
  registro_parqueadero_visitante_update(
    id: $id
    data: {
      unidadId: $unidadId
      unidadAsignadaPorUid: $asignadaPorUid
      unidadAsignadaPorNombre: $asignadaPorNombre
      unidadOrigenAsignacion: "MANUAL"
      fechaAsignacionUnidad_expr: "request.time"
      fechaActualizacion_expr: "request.time"
    }
  )
}

# ---------------------------------------------------------------------------
# Portal del residente: solo los registros del propio apartamento. La unidad la impone Data Connect
# entrando por unidad(id: $unidadId), no un id que declare el cliente. `fotoObjeto` solo aparece en el
# detalle porque la API necesita la ruta del bucket; nunca se devuelve al navegador.
# ---------------------------------------------------------------------------

query ListarRegistrosParqueaderoVisitantePorUnidadAdmin(
  $unidadId: UUID!
  $limit: Int!
  $offset: Int!
)
@auth(level: NO_ACCESS) {
  unidad(id: $unidadId) {
    apartamento
    registros: registros_parqueadero_visitante_on_unidad(
      orderBy: [{ fechaCaptura: DESC }]
      limit: $limit
      offset: $offset
    ) {
      id
      placa
      tipoVehiculo
      fechaCaptura
      fechaPosprocesamiento
      fechaControversia
    }
  }
}

query ObtenerRegistroParqueaderoVisitanteResidenteAdmin($unidadId: UUID!, $id: UUID!)
@auth(level: NO_ACCESS) {
  unidad(id: $unidadId) {
    apartamento
    registros: registros_parqueadero_visitante_on_unidad(
      where: { id: { eq: $id } }
      limit: 1
    ) {
      id
      placa
      tipoVehiculo
      fechaCaptura
      fechaPosprocesamiento
      fotoObjeto
      controversiaTexto
      fechaControversia
      controversiaEstado
      controversiaResolucionMotivo
      fechaResolucionControversia
    }
  }
}

# Guarda la controversia solo si el registro es de esa unidad y aún no tiene una. `actualizados: 0`
# significa «no es de esta unidad» o «ya tiene controversia»; la API distingue releyendo el registro.
# updateMany con la guarda en el where, no _update(id:), para que sea atómico en un solo statement.
mutation GuardarControversiaParqueaderoVisitanteResidenteAdmin(
  $id: UUID!
  $unidadId: UUID!
  $controversiaTexto: String!
  $personaId: UUID!
)
@auth(level: NO_ACCESS)
@transaction {
  actualizados: registro_parqueadero_visitante_updateMany(
    where: {
      id: { eq: $id }
      unidadId: { eq: $unidadId }
      controversiaTexto: { isNull: true }
    }
    data: {
      controversiaTexto: $controversiaTexto
      controversiaPersonaId: $personaId
      controversiaEstado: "PENDIENTE"
      fechaControversia_expr: "request.time"
      fechaActualizacion_expr: "request.time"
    }
  )
}

# ---------------------------------------------------------------------------
# Administración: resolución de controversias. Aceptar desasocia la unidad del registro (no lo borra)
# y lo deja reasignable; rechazar la deja como estaba. La guarda por estado PENDIENTE va en el where
# para que dos resoluciones simultáneas no se pisen.
# ---------------------------------------------------------------------------

query ListarControversiasParqueaderoVisitanteAdmin($estado: String!, $limite: Int!)
@auth(level: NO_ACCESS) {
  registros_parqueadero_visitante(
    where: { controversiaEstado: { eq: $estado } }
    orderBy: [{ fechaControversia: DESC }]
    limit: $limite
  ) {
    id
    placa
    tipoVehiculo
    fechaCaptura
    fechaPosprocesamiento
    vinculoId
    unidadOrigenAsignacion
    controversiaTexto
    fechaControversia
    controversiaEstado
    controversiaResolucionMotivo
    fechaResolucionControversia
    controversiaResueltaPorNombre
    controversiaPersona {
      nombreCompleto
    }
    unidad {
      id
      apartamento
    }
  }
}

# Contexto congelado de los vínculos que atribuyeron esos registros. Va en una consulta aparte porque
# `vinculoId` es un escalar: Data Connect no admite una relación a VinculoVehiculoUnidad (clave
# compuesta con campos de referencia), así que no se puede navegar desde el registro.
query ObtenerVinculosVehiculoPorIdsAdmin($ids: [UUID!]!)
@auth(level: NO_ACCESS) {
  vinculos_vehiculo_unidad(where: { id: { in: $ids } }) {
    id
    tipoVinculo
    estadoVinculo
    esActual
    vigenteDesde
    vigenteHasta
    origenRegistro
    retiradoPorNombre
    vehiculo {
      placa
    }
    unidad {
      apartamento
    }
    autorizadoPorPersona {
      nombreCompleto
    }
  }
}

mutation AceptarControversiaParqueaderoVisitanteAdmin(
  $id: UUID!
  $motivo: String!
  $resueltaPorUid: String!
  $resueltaPorNombre: String
)
@auth(level: NO_ACCESS)
@transaction {
  actualizados: registro_parqueadero_visitante_updateMany(
    where: { id: { eq: $id }, controversiaEstado: { eq: "PENDIENTE" } }
    data: {
      unidadId: null
      unidadOrigenAsignacion: null
      controversiaEstado: "ACEPTADA"
      controversiaResolucionMotivo: $motivo
      controversiaResueltaPorUid: $resueltaPorUid
      controversiaResueltaPorNombre: $resueltaPorNombre
      fechaResolucionControversia_expr: "request.time"
      fechaActualizacion_expr: "request.time"
    }
  )
}

mutation RechazarControversiaParqueaderoVisitanteAdmin(
  $id: UUID!
  $motivo: String!
  $resueltaPorUid: String!
  $resueltaPorNombre: String
)
@auth(level: NO_ACCESS)
@transaction {
  actualizados: registro_parqueadero_visitante_updateMany(
    where: { id: { eq: $id }, controversiaEstado: { eq: "PENDIENTE" } }
    data: {
      controversiaEstado: "RECHAZADA"
      controversiaResolucionMotivo: $motivo
      controversiaResueltaPorUid: $resueltaPorUid
      controversiaResueltaPorNombre: $resueltaPorNombre
      fechaResolucionControversia_expr: "request.time"
      fechaActualizacion_expr: "request.time"
    }
  )
}

# ---------------------------------------------------------------------------
# Asignación retroactiva: al asociar un vehículo a una unidad, los registros de esa placa que quedaron
# sin apartamento vuelven a esa unidad. Cierra la evasión de «no registrar el vehículo».
# No toca los que ya tienen apartamento ni los ya posprocesados (el corte de valor vigente).
# ---------------------------------------------------------------------------
mutation AsignarRetroactivoRegistrosParqueaderoVisitanteAdmin(
  $placa: String!
  $unidadId: UUID!
  $vehiculoId: UUID!
  $vinculoId: UUID!
  $desde: Timestamp!
  $asignadaPorUid: String!
  $asignadaPorNombre: String
)
@auth(level: NO_ACCESS)
@transaction {
  asignados: registro_parqueadero_visitante_updateMany(
    where: {
      placa: { eq: $placa }
      unidadId: { isNull: true }
      fechaPosprocesamiento: { isNull: true }
      fechaCaptura: { ge: $desde }
    }
    data: {
      unidadId: $unidadId
      vehiculoId: $vehiculoId
      vinculoId: $vinculoId
      unidadOrigenAsignacion: "RETROACTIVA"
      unidadAsignadaPorUid: $asignadaPorUid
      unidadAsignadaPorNombre: $asignadaPorNombre
      fechaAsignacionUnidad_expr: "request.time"
      fechaActualizacion_expr: "request.time"
    }
  )
}

# ---------------------------------------------------------------------------
# Tarifas y días de gracia. Las lee vigilancia; solo administración las escribe (lo impone la API).
# ---------------------------------------------------------------------------

query ListarTarifasParqueaderoVisitanteAdmin
@auth(level: NO_ACCESS) {
  tarifas_parqueadero_visitante(orderBy: [{ tipoVehiculo: ASC }]) {
    tipoVehiculo
    valorSancion
    diasGraciaVisitante
    diasGraciaResidente
    actualizadoPorNombre
    fechaActualizacion
  }
}

mutation GuardarTarifaParqueaderoVisitanteAdmin(
  $tipoVehiculo: String!
  $valorSancion: Float!
  $diasGraciaVisitante: Int!
  $diasGraciaResidente: Int!
  $actualizadoPorUid: String!
  $actualizadoPorNombre: String
)
@auth(level: NO_ACCESS)
@transaction {
  tarifa_parqueadero_visitante_upsert(
    data: {
      tipoVehiculo: $tipoVehiculo
      valorSancion: $valorSancion
      diasGraciaVisitante: $diasGraciaVisitante
      diasGraciaResidente: $diasGraciaResidente
      actualizadoPorUid: $actualizadoPorUid
      actualizadoPorNombre: $actualizadoPorNombre
      fechaActualizacion_expr: "request.time"
    }
  )
}
