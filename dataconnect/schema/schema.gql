type Unidad @table(name: "unidades", singular: "unidad", plural: "unidades", key: "id") {
  id: UUID! @default(expr: "uuidV4()")
  torre: Int!
  apartamento: String!
  codigoOficial: String @unique
  areaPrivada: Float @col(dataType: "numeric(12,2)")
  coeficiente: Float @col(dataType: "numeric(14,8)")
  presupuestoAnual: Float @col(dataType: "numeric(16,2)")
  fechaEntrega: Date
  estadoUnidad: String! @default(value: "NO_ENTREGADA")
  activo: Boolean! @default(value: true)
  fechaCreacion: Timestamp! @default(expr: "request.time")
  fechaActualizacion: Timestamp! @default(expr: "request.time")
}

type Persona @table(name: "personas", singular: "persona", plural: "personas", key: "id") {
  id: UUID! @default(expr: "uuidV4()")
  tipoDocumento: String!
  numeroDocumento: String!
  nombreCompleto: String!
  correo: String
  telefono: String
  activo: Boolean! @default(value: true)
  fechaCreacion: Timestamp! @default(expr: "request.time")
  fechaActualizacion: Timestamp! @default(expr: "request.time")
}

type Colaborador
  @table(name: "colaboradores", singular: "colaborador", plural: "colaboradores", key: "id") {
  id: UUID! @default(expr: "uuidV4()")
  tipoDocumento: String!
  numeroDocumento: String! @unique
  nombreCompleto: String!
  rol: String!
  correo: String
  telefono: String
  firebaseUid: String @unique
  activo: Boolean! @default(value: true)
  fechaCreacion: Timestamp! @default(expr: "request.time")
  fechaActualizacion: Timestamp! @default(expr: "request.time")
}

type VinculoUnidadPersona
  @table(
    name: "vinculo_unidad_persona"
    singular: "vinculo_unidad_persona"
    plural: "vinculos_unidad_persona"
    key: ["persona", "unidad", "tipoRelacion", "fechaInicio"]
  ) {
  id: UUID! @default(expr: "uuidV4()") @unique
  persona: Persona!
  unidad: Unidad!
  tipoRelacion: String!
  fechaInicio: Date!
  fechaFin: Date
  activo: Boolean! @default(value: true)
  fechaCreacion: Timestamp! @default(expr: "request.time")
  fechaActualizacion: Timestamp! @default(expr: "request.time")
}

type Vehiculo
  @table(
    name: "vehiculos"
    singular: "vehiculo"
    plural: "vehiculos"
    key: "id"
  ) {
  id: UUID! @default(expr: "uuidV4()")
  placa: String! @unique
  tipoVehiculo: String
  marca: String
  modelo: String
  color: String
  estadoVehiculo: String! @default(value: "ACTIVO")
  fuentes: String
  activo: Boolean! @default(value: true)
  fechaCreacion: Timestamp! @default(expr: "request.time")
  fechaActualizacion: Timestamp! @default(expr: "request.time")
}

type VinculoVehiculoUnidad
  @table(
    name: "vinculos_vehiculo_unidad"
    singular: "vinculo_vehiculo_unidad"
    plural: "vinculos_vehiculo_unidad"
    key: ["vehiculo", "unidad", "tipoVinculo", "vigenteDesde"]
  ) {
  id: UUID! @default(expr: "uuidV4()") @unique
  vehiculo: Vehiculo!
  unidad: Unidad!
  tipoVinculo: String!
  estadoVinculo: String! @default(value: "ACTIVO")
  esActual: Boolean! @default(value: true)
  vigenteDesde: Timestamp!
  vigenteHasta: Timestamp
  protegidoHasta: Timestamp
  origenRegistro: String!
  fuente: String
  fuentesRespaldo: String
  confianza: String
  estadoRevision: String
  registradoPorUid: String
  fechaCreacion: Timestamp! @default(expr: "request.time")
  fechaActualizacion: Timestamp! @default(expr: "request.time")
}


type Parqueadero @table(name: "parqueaderos", singular: "parqueadero", plural: "parqueaderos", key: "id") {
  id: UUID! @default(expr: "uuidV4()")
  codigo: String! @unique
  tipoParqueadero: String
  ubicacionFisica: String
  areaPrivada: Float @col(dataType: "numeric(12,2)")
  coeficiente: Float @col(dataType: "numeric(14,8)")
  presupuesto: Float @col(dataType: "numeric(16,2)")
  estadoParqueadero: String
  fechaEntrega: Date
  torre: Int
  unidad: Unidad
  activo: Boolean! @default(value: true)
  fechaCreacion: Timestamp! @default(expr: "request.time")
  fechaActualizacion: Timestamp! @default(expr: "request.time")
}

type Mascota @table(name: "mascotas", singular: "mascota", plural: "mascotas", key: "id") {
  id: UUID! @default(expr: "uuidV4()")
  unidad: Unidad!
  personaResponsable: Persona
  nombre: String
  especie: String
  raza: String
  color: String
  activo: Boolean! @default(value: true)
  fechaCreacion: Timestamp! @default(expr: "request.time")
  fechaActualizacion: Timestamp! @default(expr: "request.time")
}

type ContactoEmergencia
  @table(
    name: "contactos_emergencia"
    singular: "contacto_emergencia"
    plural: "contactos_emergencia"
    key: "id"
  ) {
  id: UUID! @default(expr: "uuidV4()")
  unidad: Unidad!
  nombre: String
  parentesco: String
  telefono: String
  telefonoAlterno: String
  activo: Boolean! @default(value: true)
  fechaCreacion: Timestamp! @default(expr: "request.time")
  fechaActualizacion: Timestamp! @default(expr: "request.time")
}


type HistorialCartera @table(
  name: "historial_cartera"
  singular: "historial_cartera"
  plural: "historial_carteras"
  key: "id"
) {
  id: UUID! @default(expr: "uuidV4()")
  unidad: Unidad!
  periodo: String!
  fechaCorte: Date
  saldoAnterior: Float @col(dataType: "numeric(16,2)")
  saldoActual: Float @col(dataType: "numeric(16,2)")
  cargos: Float @col(dataType: "numeric(16,2)")
  estadoCuenta: String
  elegibleReservas: Boolean
  fechaCreacion: Timestamp! @default(expr: "request.time")
  fechaActualizacion: Timestamp @default(expr: "request.time")
}

# Unique constraint: only one record per unidad per periodo
# This is handled by database: CREATE UNIQUE INDEX historial_cartera_unidad_periodo_idx ON historial_cartera(unidad_id, periodo)

type ZonaComun @table(name: "zonas_comunes", singular: "zona_comun", plural: "zonas_comunes", key: "id") {
  id: UUID! @default(expr: "uuidV4()")
  codigo: String! @unique
  tipo: String!
  descripcion: String!
  horaApertura: String!
  horaCierre: String!
  duracionMinHoras: Int!
  duracionMaxHoras: Int!
  costoReserva: Float @col(dataType: "numeric(16,2)")
  depositoGarantia: Float @col(dataType: "numeric(16,2)")
  requierePago: Boolean!
  requiereAprobacion: Boolean!
  anticipacionMinHabiles: Int!
  anticipacionMaxDias: Int!
  soportaModalidadRecreativa: Boolean! @default(value: false)
  costoRecreativo: Float @col(dataType: "numeric(16,2)")
  depositoRecreativo: Float @col(dataType: "numeric(16,2)")
  requierePagoRecreativo: Boolean
  requiereAprobacionRecreativo: Boolean
  anticipacionMinHabilesRecreativo: Int
  anticipacionMaxDiasRecreativo: Int
  activo: Boolean! @default(value: true)
  fechaCreacion: Timestamp! @default(expr: "request.time")
  fechaActualizacion: Timestamp! @default(expr: "request.time")
}

type Reserva @table(name: "reservas", singular: "reserva", plural: "reservas", key: "id") {
  id: UUID! @default(expr: "uuidV4()")
  unidad: Unidad!
  personaSolicitante: Persona
  zonaComun: ZonaComun!
  modalidadUso: String! @default(value: "ORGANIZADO_CON_INVITADOS")
  fechaHoraInicio: Timestamp!
  fechaHoraFin: Timestamp!
  estado: String! @default(value: "PENDIENTE")
  precio: Float @col(dataType: "numeric(16,2)")
  depositoGarantia: Float @col(dataType: "numeric(16,2)")
  requierePago: Boolean!
  requiereAprobacion: Boolean!
  confirmacionAutomatica: Boolean!
  estadoPago: String! @default(value: "NO_REQUIERE")
  fechaPago: Timestamp
  origen: String! @default(value: "RESIDENTE")
  creadoPorUid: String
  motivoRechazo: String
  motivoCancelacion: String
  observaciones: String
  fechaCreacion: Timestamp! @default(expr: "request.time")
  fechaActualizacion: Timestamp! @default(expr: "request.time")
}

type UsuarioPortal
  @table(
    name: "usuarios_portal"
    singular: "usuario_portal"
    plural: "usuarios_portal"
    key: "id"
  ) {
  id: UUID! @default(expr: "uuidV4()")

  firebaseUid: String! @unique
  persona: Persona

  rolGlobal: String!
  activo: Boolean! @default(value: true)

  ultimoAcceso: Timestamp

  fechaCreacion: Timestamp!
    @default(expr: "request.time")

  fechaActualizacion: Timestamp!
    @default(expr: "request.time")
}

type EventoAuditoria @table(name: "eventos_auditoria", singular: "evento_auditoria", plural: "eventos_auditoria", key: "id") {
  id: UUID! @default(expr: "uuidV4()")
  usuarioPortal: UsuarioPortal
  accion: String
  tipoEntidad: String
  entidadId: UUID
  datosAnteriores: Any
  datosNuevos: Any
  motivo: String
  direccionIp: String
  agenteUsuario: String
  fechaCreacion: Timestamp! @default(expr: "request.time")
}

type Sancion @table(name: "sanciones", singular: "sancion", plural: "sanciones", key: "id") {
  id: UUID! @default(expr: "uuidV4()")
  unidad: Unidad!
  personaResponsable: Persona
  tipoSancion: String
  descripcion: String
  fechaImposicion: Date
  valor: Float @col(dataType: "numeric(16,2)")
  estado: String
  fechaNotificacion: Date
  fechaPago: Date
  fechaCierre: Date
  observaciones: String
  fechaCreacion: Timestamp! @default(expr: "request.time")
  fechaActualizacion: Timestamp! @default(expr: "request.time")
}