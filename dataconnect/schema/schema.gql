# Data Connect Schema - Bulevar Verde Portal
# Updated: 2026-09-02 with complete convivencia sanction workflow

type Unidad @table(name: "unidades", singular: "unidad", plural: "unidades", key: "id") {
  id: UUID! @default(expr: "uuidV4()")
  torre: Int!
  apartamento: String!
  codigoOficial: String @unique
  areaPrivada: Float @col(dataType: "numeric(12,2)")
  coeficiente: Float @col(dataType: "numeric(14,8)")
  presupuestoAnual: Float @col(dataType: "numeric(16,2)")
  fechaEntrega: Date
  estadoUnidad: String! @default(value: "NO_ENTREGADA")
  activo: Boolean! @default(value: true)
  fechaCreacion: Timestamp! @default(expr: "request.time")
  fechaActualizacion: Timestamp! @default(expr: "request.time")
}

type Persona @table(name: "personas", singular: "persona", plural: "personas", key: "id") {
  id: UUID! @default(expr: "uuidV4()")
  tipoDocumento: String!
  numeroDocumento: String!
  nombreCompleto: String!
  correo: String
  telefono: String
  activo: Boolean! @default(value: true)
  fechaCreacion: Timestamp! @default(expr: "request.time")
  fechaActualizacion: Timestamp! @default(expr: "request.time")
}

type Colaborador
  @table(name: "colaboradores", singular: "colaborador", plural: "colaboradores", key: "id") {
  id: UUID! @default(expr: "uuidV4()")
  tipoDocumento: String!
  numeroDocumento: String! @unique
  nombreCompleto: String!
  rol: String!
  correo: String
  telefono: String
  firebaseUid: String @unique
  activo: Boolean! @default(value: true)
  fechaCreacion: Timestamp! @default(expr: "request.time")
  fechaActualizacion: Timestamp! @default(expr: "request.time")
}

type VinculoUnidadPersona
  @table(
    name: "vinculo_unidad_persona"
    singular: "vinculo_unidad_persona"
    plural: "vinculos_unidad_persona"
    key: ["persona", "unidad", "tipoRelacion", "fechaInicio"]
  ) {
  id: UUID! @default(expr: "uuidV4()") @unique
  persona: Persona!
  unidad: Unidad!
  tipoRelacion: String!
  fechaInicio: Date!
  fechaFin: Date
  activo: Boolean! @default(value: true)
  fechaCreacion: Timestamp! @default(expr: "request.time")
  fechaActualizacion: Timestamp! @default(expr: "request.time")
}

type Vehiculo
  @table(
    name: "vehiculos"
    singular: "vehiculo"
    plural: "vehiculos"
    key: "id"
  ) {
  id: UUID! @default(expr: "uuidV4()")
  placa: String! @unique
  tipoVehiculo: String
  marca: String
  modelo: String
  color: String
  estadoVehiculo: String! @default(value: "ACTIVO")
  fuentes: String
  activo: Boolean! @default(value: true)
  fechaCreacion: Timestamp! @default(expr: "request.time")
  fechaActualizacion: Timestamp! @default(expr: "request.time")
}

type VinculoVehiculoUnidad
  @table(
    name: "vinculos_vehiculo_unidad"
    singular: "vinculo_vehiculo_unidad"
    plural: "vinculos_vehiculo_unidad"
    key: ["vehiculo", "unidad", "tipoVinculo", "vigenteDesde"]
  ) {
  id: UUID! @default(expr: "uuidV4()") @unique
  vehiculo: Vehiculo!
  unidad: Unidad!
  tipoVinculo: String!
  estadoVinculo: String! @default(value: "ACTIVO")
  esActual: Boolean! @default(value: true)
  vigenteDesde: Timestamp!
  vigenteHasta: Timestamp
  protegidoHasta: Timestamp
  origenRegistro: String!
  fuente: String
  fuentesRespaldo: String
  confianza: String
  estadoRevision: String
  registradoPorUid: String
  # Quién autorizó el ingreso del visitante (la persona de la unidad que lo recibe) y quién retiró el
  # vínculo. El retiro se conserva (esActual=false) pero antes no quedaba atribuido a nadie, y
  # administración lo necesita al resolver una controversia de parqueadero.
  autorizadoPorPersona: Persona
  retiradoPorUid: String
  retiradoPorNombre: String
  fechaCreacion: Timestamp! @default(expr: "request.time")
  fechaActualizacion: Timestamp! @default(expr: "request.time")
}


type Parqueadero @table(name: "parqueaderos", singular: "parqueadero", plural: "parqueaderos", key: "id") {
  id: UUID! @default(expr: "uuidV4()")
  codigo: String! @unique
  tipoParqueadero: String
  ubicacionFisica: String
  areaPrivada: Float @col(dataType: "numeric(12,2)")
  coeficiente: Float @col(dataType: "numeric(14,8)")
  presupuesto: Float @col(dataType: "numeric(16,2)")
  estadoParqueadero: String
  fechaEntrega: Date
  torre: Int
  unidad: Unidad
  activo: Boolean! @default(value: true)
  fechaCreacion: Timestamp! @default(expr: "request.time")
  fechaActualizacion: Timestamp! @default(expr: "request.time")
}

type Mascota @table(name: "mascotas", singular: "mascota", plural: "mascotas", key: "id") {
  id: UUID! @default(expr: "uuidV4()")
  unidad: Unidad!
  personaResponsable: Persona
  nombre: String
  especie: String
  raza: String
  color: String
  activo: Boolean! @default(value: true)
  fechaCreacion: Timestamp! @default(expr: "request.time")
  fechaActualizacion: Timestamp! @default(expr: "request.time")
}

type ContactoEmergencia
  @table(
    name: "contactos_emergencia"
    singular: "contacto_emergencia"
    plural: "contactos_emergencia"
    key: "id"
  ) {
  id: UUID! @default(expr: "uuidV4()")
  unidad: Unidad!
  nombre: String
  parentesco: String
  telefono: String
  telefonoAlterno: String
  activo: Boolean! @default(value: true)
  fechaCreacion: Timestamp! @default(expr: "request.time")
  fechaActualizacion: Timestamp! @default(expr: "request.time")
}


type HistorialCartera @table(
  name: "historial_cartera"
  singular: "historial_cartera"
  plural: "historial_carteras"
  key: "id"
) {
  id: UUID! @default(expr: "uuidV4()")
  unidad: Unidad!
  periodo: String!
  fechaCorte: Date
  saldoAnterior: Float @col(dataType: "numeric(16,2)")
  saldoActual: Float @col(dataType: "numeric(16,2)")
  cargos: Float @col(dataType: "numeric(16,2)")
  estadoCuenta: String
  elegibleReservas: Boolean
  fechaCreacion: Timestamp! @default(expr: "request.time")
  fechaActualizacion: Timestamp @default(expr: "request.time")
}

# Unique constraint: only one record per unidad per periodo
# This is handled by database: CREATE UNIQUE INDEX historial_cartera_unidad_periodo_idx ON historial_cartera(unidad_id, periodo)

type ZonaComun @table(name: "zonas_comunes", singular: "zona_comun", plural: "zonas_comunes", key: "id") {
  id: UUID! @default(expr: "uuidV4()")
  codigo: String! @unique
  tipo: String!
  descripcion: String!
  horaApertura: String!
  horaCierre: String!
  duracionMinHoras: Int!
  duracionMaxHoras: Int!
  costoReserva: Float @col(dataType: "numeric(16,2)")
  depositoGarantia: Float @col(dataType: "numeric(16,2)")
  requierePago: Boolean!
  requiereAprobacion: Boolean!
  anticipacionMinHabiles: Int!
  anticipacionMaxDias: Int!
  soportaModalidadRecreativa: Boolean! @default(value: false)
  costoRecreativo: Float @col(dataType: "numeric(16,2)")
  depositoRecreativo: Float @col(dataType: "numeric(16,2)")
  requierePagoRecreativo: Boolean
  requiereAprobacionRecreativo: Boolean
  anticipacionMinHabilesRecreativo: Int
  anticipacionMaxDiasRecreativo: Int
  activo: Boolean! @default(value: true)
  fechaCreacion: Timestamp! @default(expr: "request.time")
  fechaActualizacion: Timestamp! @default(expr: "request.time")
}

type Reserva @table(name: "reservas", singular: "reserva", plural: "reservas", key: "id") {
  id: UUID! @default(expr: "uuidV4()")
  unidad: Unidad!
  personaSolicitante: Persona
  zonaComun: ZonaComun!
  modalidadUso: String! @default(value: "ORGANIZADO_CON_INVITADOS")
  fechaHoraInicio: Timestamp!
  fechaHoraFin: Timestamp!
  estado: String! @default(value: "PENDIENTE")
  precio: Float @col(dataType: "numeric(16,2)")
  depositoGarantia: Float @col(dataType: "numeric(16,2)")
  requierePago: Boolean!
  requiereAprobacion: Boolean!
  confirmacionAutomatica: Boolean!
  estadoPago: String! @default(value: "NO_REQUIERE")
  fechaPago: Timestamp
  origen: String! @default(value: "RESIDENTE")
  creadoPorUid: String
  motivoRechazo: String
  motivoCancelacion: String
  # Momento exacto de la cancelación (reloj de la API, escrito junto con el cambio de estado).
  # Solo cambia en la transición PENDIENTE/CONFIRMADA -> CANCELADA; nunca se reescribe.
  # NULL en reservas canceladas antes del cupo diario (sin dato fiable: no se inventa).
  fechaCancelacion: Timestamp
  # Clasificación de cupo fijada al cancelar: true = cancelada con >= 72 h de anticipación (devuelve
  # el cupo del apartamento), false = cancelada tarde (el cupo sigue consumido). NULL = no cancelada
  # o cancelada antes del cupo diario (tratamiento histórico: no consume cupo).
  cupoLiberado: Boolean
  observaciones: String
  fechaCreacion: Timestamp! @default(expr: "request.time")
  fechaActualizacion: Timestamp! @default(expr: "request.time")
}

# Control de concurrencia (optimista) del cupo diario de reservas, una fila por (apartamento,
# categoría de zona, día de Bogotá). No guarda conteos: el cupo siempre se deriva de Reserva.
# `version` sube en la misma transacción que cualquier escritura que AÑADA una reserva consumidora a
# la tupla (crear, o mover una reserva a ella). Quien crea con límite lee `version`, y al escribir hace
# `UPDATE ... WHERE version = <leída>`: si otra transacción añadió una reserva entretanto, ese UPDATE
# afecta 0 filas, el @check aborta la transacción y la API reintenta. Cancelar/rechazar solo reducen
# el conteo y no necesitan subir la versión.
type CupoReservaDia
  @table(
    name: "cupos_reserva_dia"
    singular: "cupo_reserva_dia"
    plural: "cupos_reserva_dia"
    key: ["unidad", "categoria", "dia"]
  ) {
  unidad: Unidad!
  categoria: String!
  dia: Date!
  version: Int! @default(value: 0)
  fechaActualizacion: Timestamp! @default(expr: "request.time")
}

type UsuarioPortal
  @table(
    name: "usuarios_portal"
    singular: "usuario_portal"
    plural: "usuarios_portal"
    key: "id"
  ) {
  id: UUID! @default(expr: "uuidV4()")

  firebaseUid: String! @unique
  persona: Persona

  rolGlobal: String!
  activo: Boolean! @default(value: true)

  ultimoAcceso: Timestamp

  fechaCreacion: Timestamp!
    @default(expr: "request.time")

  fechaActualizacion: Timestamp!
    @default(expr: "request.time")
}

type EventoAuditoria @table(name: "eventos_auditoria", singular: "evento_auditoria", plural: "eventos_auditoria", key: "id") {
  id: UUID! @default(expr: "uuidV4()")
  usuarioPortal: UsuarioPortal
  accion: String
  tipoEntidad: String
  entidadId: UUID
  datosAnteriores: Any
  datosNuevos: Any
  motivo: String
  direccionIp: String
  agenteUsuario: String
  fechaCreacion: Timestamp! @default(expr: "request.time")
}

type Sancion @table(name: "sanciones", singular: "sancion", plural: "sanciones", key: "id") {
  id: UUID! @default(expr: "uuidV4()")
  unidad: Unidad!
  personaResponsable: Persona
  caso: CasoConvivencia
  tipoSancion: String
  descripcion: String
  fechaImposicion: Date
  valor: Float @col(dataType: "numeric(16,2)")
  estado: String
  fechaNotificacion: Date
  fechaPago: Date
  fechaCierre: Date
  observaciones: String
  fechaCreacion: Timestamp! @default(expr: "request.time")
  fechaActualizacion: Timestamp! @default(expr: "request.time")
}

type CasoConvivencia
  @table(name: "casos_convivencia", singular: "caso_convivencia", plural: "casos_convivencia", key: "id") {
  id: UUID! @default(expr: "uuidV4()")
  caseCode: String! @unique
  unidad: Unidad!
  apartamento: String!
  motivo: String!
  descripcion: String!
  razonNotificacion: String!
  severidad: String!
  sancionEquivalente: Float @col(dataType: "numeric(6,2)")
  notificadorAdmin: String!
  creadoPorUid: String
  requiereProcesoFormal: Boolean! @default(value: true)
  estado: String! @default(value: "PENDIENTE_DESCARGOS")
  descargosResidente: String
  fechaDescargos: Timestamp
  actaComiteFecha: Timestamp
  actaComiteResumen: String
  sancionPropuestaTipo: String
  sancionPropuestaValor: Float @col(dataType: "numeric(16,2)")
  sancionPropuestaJustificacion: String
  sancionPropuestaPersona: Persona
  apelacionTexto: String
  fechaApelacion: Timestamp
  resolucion: String
  notasAdmin: String
  resueltoPorUid: String
  clientRequestId: String @unique
  # Registro progresivo: BORRADOR mientras se cargan adjuntos ("Pendiente de completar y
  # notificar"); FINALIZADO tras "Finalizar y notificar". Es independiente de `estado` (la
  # máquina del procedimiento). El valor por defecto deja los casos existentes como FINALIZADO.
  registro: String! @default(value: "FINALIZADO")
  # Control de concurrencia: declarar adjuntos y finalizar exigen la versión leída.
  registroVersion: Int! @default(value: 0)
  fechaFinalizacion: Timestamp
  finalizadoPorUid: String
  # Remisión a órganos de gobierno: administración gestiona todos los casos y decide cuáles
  # pasan al Comité de Convivencia y/o al Consejo de Administración. Cada órgano solo ve los
  # casos remitidos a él. Es definitiva (no hay retiro) y los casos existentes quedan sin remitir.
  remitidoComite: Boolean! @default(value: false)
  fechaRemisionComite: Timestamp
  remitidoComitePorUid: String
  remitidoConsejo: Boolean! @default(value: false)
  fechaRemisionConsejo: Timestamp
  remitidoConsejoPorUid: String
  # Administración puede ocultar (y volver a mostrar) toda la evidencia del caso en cualquier
  # momento: mientras esté oculta solo administración la ve; la API la omite para comité, consejo,
  # residente y vigilancia.
  evidenciaOculta: Boolean! @default(value: false)
  # Casos de proceso formal quedan pendientes de notificar al finalizar: administración los
  # notifica (eligiendo destinatarios). Un llamado de atención se notifica solo. Mientras esté
  # pendiente el residente no ve el caso y no hay trámite (descargos, acta, propuesta...).
  pendienteNotificar: Boolean! @default(value: false)
  fechaNotificacion: Timestamp
  # «Leída»: el residente abrió el caso en el portal (a los 20 s el portal avisa a la API, sin
  # mostrar nada). Se guarda solo la primera lectura; volver a notificar no la reinicia.
  fechaLecturaResidente: Timestamp
  lecturaResidentePorUid: String
  fechaCambioEvidenciaOculta: Timestamp
  evidenciaOcultaPorUid: String
  fechaCreacion: Timestamp! @default(expr: "request.time")
  fechaActualizacion: Timestamp! @default(expr: "request.time")
}

type EvidenciaConvivencia
  @table(
    name: "evidencias_convivencia"
    singular: "evidencia_convivencia"
    plural: "evidencias_convivencia"
    key: "id"
  ) {
  id: UUID! @default(expr: "uuidV4()")
  caso: CasoConvivencia!
  contexto: String!
  url: String!
  driveFileId: String
  nombreArchivo: String
  mimeType: String
  tamanoBytes: Int
  # null = histórico en Google Drive (url de Drive); "GCS" = bucket privado de evidencias
  # (url = gs://bucket/objeto, solo accesible con URL firmada emitida por la API).
  almacenamiento: String
  objetoRuta: String
  fechaCreacion: Timestamp! @default(expr: "request.time")
}

# Archivo declarado para un caso antes de subirse. La clave `id` la genera el cliente
# (clientFileId), así la base de datos garantiza una sola fila por archivo incluso con
# solicitudes simultáneas. Cuando el archivo queda LISTO se crea la EvidenciaConvivencia
# con el mismo id; mientras tanto no existe evidencia ni URL.
# estado: DECLARADO → SUBIENDO → LISTO; RECHAZADO (motivo) | RETIRADO | ABANDONADO.
type AdjuntoConvivencia
  @table(
    name: "adjuntos_convivencia"
    singular: "adjunto_convivencia"
    plural: "adjuntos_convivencia"
    key: "id"
  ) {
  id: UUID!
  caso: CasoConvivencia!
  contexto: String!
  estado: String!
  nombreOriginal: String!
  mimeType: String!
  tamanoBytes: Int64!
  objetoRuta: String!
  crc32c: String
  motivo: String
  creadoPorUid: String
  version: Int! @default(value: 0)
  fechaCreacion: Timestamp! @default(expr: "request.time")
  fechaActualizacion: Timestamp! @default(expr: "request.time")
}

# Una fila por caso y destinatario (RESIDENTES | ADMINISTRACION): la clave compuesta impide
# solicitudes duplicadas. estado: SOLICITADA → ENVIANDO → ENVIADA; FALLIDA_REINTENTABLE,
# FALLIDA (requiere acción), INCIERTA (resultado ambiguo; no se reenvía sola), SIN_DESTINATARIOS.
# POR_NOTIFICAR (solo RESIDENTES de un caso de proceso formal): espera a que administración notifique.
# tipo: RESIDENTES | ADMINISTRACION | SANCION | RECURSO | CIERRE_SIN_SANCION (las tres últimas comunican
# por escrito al residente las decisiones del Consejo: reglamento art. 46 y 48, Ley 675 arts. 51 y 62).
type NotificacionCasoConvivencia
  @table(
    name: "notificaciones_caso_convivencia"
    singular: "notificacion_caso_convivencia"
    plural: "notificaciones_caso_convivencia"
    key: ["caso", "tipo"]
  ) {
  caso: CasoConvivencia!
  tipo: String!
  estado: String!
  intentos: Int! @default(value: 0)
  leaseHasta: Timestamp
  destinatarios: Int
  aceptados: Int
  rechazados: Int
  messageId: String
  ultimoError: String
  # Selección de administración: JSON [{ nombre, correo, rol }]. null = se calcula al enviar
  # (envío automático del llamado de atención y aviso a administración).
  destinatariosJson: String
  # Número de envío (sube con cada «Notificar»/«Volver a notificar»): hace único el messageId.
  envio: Int! @default(value: 0)
  solicitadaPorUid: String
  # Comunicaciones de decisiones del Consejo (tipo SANCION | RECURSO | CIERRE_SIN_SANCION): foto de la
  # decisión al registrarla, JSON { decision, resolucion, tipoSancion, valor, fecha }.
  detalleJson: String
  resueltoPorUid: String
  fechaEnvio: Timestamp
  fechaCreacion: Timestamp! @default(expr: "request.time")
  fechaActualizacion: Timestamp! @default(expr: "request.time")
}

type EventoCasoConvivencia
  @table(
    name: "eventos_caso_convivencia"
    singular: "evento_caso_convivencia"
    plural: "eventos_caso_convivencia"
    key: "id"
  ) {
  id: UUID! @default(expr: "uuidV4()")
  caso: CasoConvivencia!
  tipoEvento: String!
  estadoAnterior: String
  estadoNuevo: String!
  descripcion: String
  actorUid: String
  actorTipo: String!
  fechaCreacion: Timestamp! @default(expr: "request.time")
}

# Membresía de una persona (residente) a un órgano de gobierno de la copropiedad.
# Una fila por persona y órgano (clave compuesta): una persona puede estar en
# ninguno, uno o ambos órganos, cada uno con su propio cargo y estado.
# organo: "COMITE_CONVIVENCIA" | "CONSEJO_ADMINISTRACION" (string, no enum de schema).
# cargo es informativo (Presidente, Secretario, Tesorero, Vocal…); nunca decide permisos.
type MiembroOrganoGobierno
  @table(
    name: "miembros_organo_gobierno"
    singular: "miembro_organo_gobierno"
    plural: "miembros_organo_gobierno"
    key: ["persona", "organo"]
  ) {
  id: UUID! @default(expr: "uuidV4()") @unique
  persona: Persona!
  organo: String!
  cargo: String
  activo: Boolean! @default(value: true)
  fechaVinculacion: Date
  fechaRetiro: Date
  creadoPorUid: String
  fechaCreacion: Timestamp! @default(expr: "request.time")
  fechaActualizacion: Timestamp! @default(expr: "request.time")
}

# Vehículo fotografiado por vigilancia en el parqueadero de visitantes. Este registro solo guarda la
# evidencia; la sanción (moto/carro, con valor que puede cambiar de un mes a otro) se calcula en una
# etapa posterior, que marca fechaPosprocesamiento. `placa` es la confirmada por el vigilante y
# `placaDetectada` la que leyó el OCR del dispositivo. `unidad` se asigna solo si la placa coincide
# exactamente con un vehículo con vínculo vigente. La foto vive en Cloud Storage (`fotoObjeto` es la
# ruta dentro del bucket, nunca una URL pública).
type RegistroParqueaderoVisitante
  @table(
    name: "registros_parqueadero_visitante"
    singular: "registro_parqueadero_visitante"
    plural: "registros_parqueadero_visitante"
    key: "id"
  ) {
  id: UUID! @default(expr: "uuidV4()")
  placa: String!
  placaDetectada: String
  tipoVehiculo: String!
  unidad: Unidad
  fotoObjeto: String!
  fotoTamanoBytes: Int
  vigilanteNombre: String!
  registradoPorUid: String!
  fechaCaptura: Timestamp!
  fechaPosprocesamiento: Timestamp
  # Apartamento asignado a mano (desde la pestaña Sanciones) cuando la placa no lo identificó.
  unidadAsignadaPorUid: String
  unidadAsignadaPorNombre: String
  fechaAsignacionUnidad: Timestamp
  # Vehículo y vínculo que atribuyeron la unidad, congelados al capturar: administración debe poder ver
  # la relación al resolver una controversia aunque el vínculo se haya retirado después.
  # `vinculoId` es escalar y no una relación a VinculoVehiculoUnidad a propósito: su clave es compuesta
  # y contiene campos de referencia, así que Data Connect rechaza apuntarle
  # ("Reference another reference field"). Apunta a VinculoVehiculoUnidad.id, que es @unique.
  vehiculo: Vehiculo
  vinculoId: UUID
  # Cómo llegó la unidad: PLACA (coincidencia al capturar), MANUAL (un vigilante la asignó) o
  # RETROACTIVA (se asignó al crearse el vínculo del vehículo). Null cuando no hay unidad.
  unidadOrigenAsignacion: String
  # Controversia del residente desde el portal. Solo texto y una sola vez por registro.
  controversiaTexto: String
  fechaControversia: Timestamp
  controversiaPersona: Persona
  # Resolución por administración. PENDIENTE | ACEPTADA | RECHAZADA; null si no hay controversia.
  # Aceptar desasocia la unidad del registro (no lo elimina) y lo deja reasignable a otro apartamento.
  controversiaEstado: String
  controversiaResolucionMotivo: String
  fechaResolucionControversia: Timestamp
  controversiaResueltaPorUid: String
  controversiaResueltaPorNombre: String
  clientRequestId: String! @unique
  fechaCreacion: Timestamp! @default(expr: "request.time")
  fechaActualizacion: Timestamp! @default(expr: "request.time")
}

# Valor de la sanción del parqueadero de visitantes y días de gracia, por tipo de vehículo. Lo edita
# administración en la pestaña Configuración del módulo de vehículos; vigilancia solo lo lee. Una fila
# por tipo (CARRO, MOTO), no un key/value genérico, porque los parámetros son fijos y tipados.
# El cálculo del valor sobre los registros es una etapa posterior, todavía no implementada: aquí solo
# se guarda el parámetro vigente.
type TarifaParqueaderoVisitante
  @table(
    name: "tarifas_parqueadero_visitante"
    singular: "tarifa_parqueadero_visitante"
    plural: "tarifas_parqueadero_visitante"
    key: "tipoVehiculo"
  ) {
  tipoVehiculo: String!
  valorSancion: Float! @col(dataType: "numeric(16,2)")
  # Días de cortesía antes de sancionar. La asamblea autorizó 3 para visitantes reales y 0 para
  # vehículos de residentes; se distinguen por el tipoVinculo del vínculo congelado en el registro.
  diasGraciaVisitante: Int! @default(value: 0)
  diasGraciaResidente: Int! @default(value: 0)
  actualizadoPorUid: String
  actualizadoPorNombre: String
  fechaActualizacion: Timestamp! @default(expr: "request.time")
}
