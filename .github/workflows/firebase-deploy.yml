name: Deploy Firebase Hosting and Data Connect

on:
  push:
    branches: ["firebase"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v2
        with:
          hugo-version: '0.167.0'
          extended: true

      # Enlaces de Google Drive/Sheets configurables sin PR desde Settings → Secrets and variables →
      # Actions → Variables. Solo se aplican si tienen valor; si no, se usa lo de hugo.toml.
      # Para aplicar un cambio: Actions → este workflow → Run workflow.
      - name: Build with Hugo
        env:
          AVISOS_HOJA_URL: ${{ vars.AVISOS_HOJA_URL }}
          PERSONAL_DRIVE_FOLDER_ID: ${{ vars.PERSONAL_DRIVE_FOLDER_ID }}
          DOCUMENTOS_DRIVE_FOLDER_ID: ${{ vars.DOCUMENTOS_DRIVE_FOLDER_ID }}
        run: |
          if [ -n "$AVISOS_HOJA_URL" ]; then export HUGO_PARAMS_AVISOSHOJAURL="$AVISOS_HOJA_URL"; fi
          if [ -n "$PERSONAL_DRIVE_FOLDER_ID" ]; then export HUGO_PARAMS_PERSONALDRIVEFOLDERID="$PERSONAL_DRIVE_FOLDER_ID"; fi
          if [ -n "$DOCUMENTOS_DRIVE_FOLDER_ID" ]; then export HUGO_PARAMS_DOCUMENTOSDRIVEFOLDERID="$DOCUMENTOS_DRIVE_FOLDER_ID"; fi
          hugo --gc --minify

      # Firebase CLI can use the ADC file exported by google-github-actions/auth.
      # Do not pass GITHUB_TOKEN to `firebase deploy --token`: that token belongs
      # to GitHub Actions and is not a Firebase CI credential.
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: '${{ secrets.GCP_CREDENTIALS }}'

      - name: Setup Google Cloud CLI
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: project-7dd6d100-d8c2-427a-a80

      - name: Setup Firebase CLI
        run: npm install --global firebase-tools

      - name: Show deployed Data Connect services
        run: |
          firebase dataconnect:services:list \
            --project project-7dd6d100-d8c2-427a-a80

      # The API calls operations defined in dataconnect/admin/*.gql. Hosting-only
      # deployments do not publish those operations. Deploy the admin connector
      # explicitly, but do not run sql:migrate automatically: schema migrations
      # must be reviewed separately because they can be destructive.
      - name: Deploy Data Connect admin connector
        run: |
          firebase deploy \
            --only dataconnect:portal-bulevar-verde:admin \
            --project project-7dd6d100-d8c2-427a-a80 \
            --non-interactive

      - name: Deploy Firebase Hosting
        run: |
          firebase deploy \
            --only hosting \
            --project project-7dd6d100-d8c2-427a-a80 \
            --non-interactive
