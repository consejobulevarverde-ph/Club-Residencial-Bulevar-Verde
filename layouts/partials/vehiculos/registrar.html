<style>
  .vehiculos-panel .plate {
    font-family: ui-monospace, monospace;
    font-size: 1.2rem;
    font-weight: 700;
    letter-spacing: .08em;
  }

  .vehiculos-panel .registration-result {
    border-left: 6px solid #198754;
  }
</style>

<div id="vehiculosRegistrarView">
  <div class="surface p-4 p-lg-5">
    <div class="mb-4">
      <h3 class="section-title h4">
        <i class="bi bi-car-front me-2"></i>
        Registrar vehículo
      </h3>
      <p class="mb-0">
        Registra un vehículo vinculado a un apartamento para la vigilancia y control de acceso.
      </p>
    </div>

    <div id="vehRegistroAlert" class="alert hidden" aria-live="polite"></div>

    <form id="vehicleRegistrationForm" class="row g-3">
      <!-- Apartamento -->
      <div class="col-12 pt-2"><small class="text-muted fw-semibold">Apartamento</small></div>
      <div class="col-12 col-md-4">
        <label class="form-label" for="vehApartment">Número de apartamento</label>
        <input
          id="vehApartment"
          class="form-control"
          inputmode="numeric"
          maxlength="4"
          placeholder="Ej.: 1029"
          required>
      </div>

      <!-- Vehículo: primero la placa y de su formato se deduce el tipo, que el vigilante puede corregir. -->
      <div class="col-12 pt-2"><small class="text-muted fw-semibold">Vehículo</small></div>
      <div class="col-md-6">
        <label class="form-label" for="vehPlaca">Placa</label>
        <input
          id="vehPlaca"
          class="form-control plate"
          maxlength="10"
          placeholder="Ej.: ABC123"
          autocomplete="off"
          autocapitalize="characters"
          required>
        <small class="d-block text-muted mt-1">
          Si el vehículo no tiene placa (ej. moto eléctrica), escribe <strong>ELECTRICO</strong> o <strong>SIN PLACA</strong>.
        </small>
        <!-- Aviso cuando un residente ya pre-autorizó esta placa desde su portal. -->
        <div id="vehPreautorizada" class="alert alert-success py-2 px-3 mt-2 mb-0 hidden" role="status"></div>
      </div>

      <div class="col-md-6">
        <label class="form-label" for="vehTipoVehiculo">Tipo de vehículo</label>
        <select id="vehTipoVehiculo" class="form-select" required>
          <option value="CARRO">Carro</option>
          <option value="MOTO">Moto</option>
        </select>
        <small id="vehTipoAyuda" class="d-block text-muted mt-1">Se reconoce por el formato de la placa; puedes cambiarlo.</small>
      </div>

      <!-- Relación con el apartamento -->
      <div class="col-12 pt-2"><small class="text-muted fw-semibold">Relación</small></div>
      <div class="col-md-6">
        <label class="form-label" for="vehTipoVinculo">Tipo de vinculación</label>
        <select id="vehTipoVinculo" class="form-select" required>
          <option value="VISITANTE" selected>Visitante</option>
          <option value="RESIDENTE">Residente</option>
        </select>
      </div>

      <!-- Quién autoriza: se precarga al escribir el apartamento, para que el vigilante solo elija. -->
      <div class="col-md-6" id="vehAutorizaBloque">
        <label class="form-label" for="vehAutoriza">Quién autoriza el ingreso</label>
        <select id="vehAutoriza" class="form-select" disabled>
          <option value="">Escribe primero el apartamento…</option>
        </select>
        <small id="vehAutorizaEstado" class="d-block text-muted mt-1"></small>
      </div>

      <div class="col-12">
        <div class="form-check">
          <input
            id="confirmVehicleRegistration"
            class="form-check-input"
            type="checkbox"
            required>
          <label class="form-check-label" for="confirmVehicleRegistration">
            Confirmo que revisé el apartamento, el tipo de vehículo y la placa suministrados.
          </label>
        </div>
      </div>

      <div class="col-12 d-grid d-md-flex justify-content-md-end">
        <button id="registerVehicleBtn" class="btn btn-primary btn-lg" type="submit">
          <i class="bi bi-car-front-fill me-2"></i>
          Registrar vehículo
        </button>
      </div>
    </form>
  </div>

  <div id="vehicleRegistrationResult" class="mt-4"></div>
</div>
