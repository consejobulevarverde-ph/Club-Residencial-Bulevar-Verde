<div class="vehiculos-panel">
  <div class="d-flex justify-content-between align-items-center mb-3 flex-wrap gap-2">
    <h3 class="section-title h5 mb-0"><i class="bi bi-car-front me-2"></i>Gestión de Vehículos</h3>
    <div class="d-flex flex-wrap gap-2">
      <button id="showVehiculosRegistrar" type="button" class="btn btn-outline-success mode-button active">
        <i class="bi bi-plus-circle me-1"></i>Registrar
      </button>
      <button id="showVehiculosReporte" type="button" class="btn btn-outline-success mode-button">
        <i class="bi bi-clipboard-data me-1"></i>Reporte
      </button>
    </div>
  </div>

  {{ partial "vehiculos/registrar.html" . }}
  {{ partial "vehiculos/reporte.html" . }}
</div>

<script>
  window.VEHICULOS_CONFIG = {
    apiBase: {{ .Site.Params.apiBaseUrl | default "http://localhost:8080" | jsonify | safeJS }}
  };
</script>
<script src="{{ "js/vehiculos.js" | relURL }}?v=1"></script>
