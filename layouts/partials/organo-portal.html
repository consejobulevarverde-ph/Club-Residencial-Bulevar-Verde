<!DOCTYPE html>
<html lang="{{ .ctx.Site.LanguageCode | default "es" }}">

<head>
  <meta charset="UTF-8">
  <meta name="robots" content="noindex,nofollow">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{ .ctx.Title }} - {{ .ctx.Site.Title }}</title>
  <link rel="icon" type="image/png" sizes="32x32" href="{{ "images/favicon-32x32.png" | relURL }}">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ "css/administracion-datos.css" | relURL }}">
</head>

<body>
  {{ partial "header" .ctx }}

  <header class="header">
    <div class="container">
      <h1 class="fw-bold">
        <i class="bi {{ .icono }} me-2"></i>{{ .titulo }}
      </h1>
      <p class="mb-0">
        {{ .descripcion }}
      </p>
    </div>
  </header>

  <main class="container py-4" style="max-width:1400px">
    <section id="{{ .prefijo }}Login" class="surface p-4 p-lg-5 mx-auto" style="max-width:520px">
      <h2 class="section-title h4 mb-3">Acceso para miembros {{ .deOrgano }}</h2>
      <div id="{{ .prefijo }}LoginAlert" class="alert alert-danger hidden" aria-live="polite"></div>
      <form id="{{ .prefijo }}LoginForm" class="row g-3">
        <div class="col-12">
          <label class="form-label" for="{{ .prefijo }}NumeroDocumento">Número de documento</label>
          <input id="{{ .prefijo }}NumeroDocumento" type="text" class="form-control text-uppercase" inputmode="text"
            placeholder="1234567890" required autocomplete="off">
        </div>
        <div class="col-12 d-grid">
          <button id="{{ .prefijo }}LoginBtn" class="btn btn-primary btn-lg" type="submit">Ingresar</button>
        </div>
      </form>
    </section>

    <section id="{{ .prefijo }}App" class="hidden">
      <div class="d-flex justify-content-between align-items-center mb-3 flex-wrap gap-2">
        <div>
          <h2 class="section-title h3 mb-0">Casos de convivencia</h2>
          <div id="{{ .prefijo }}Usuario" class="small-note"></div>
        </div>
        <button id="{{ .prefijo }}SalirBtn" type="button" class="btn btn-outline-secondary">Salir</button>
      </div>

      {{ partial "convivencia-casos/index.html" (dict "ctx" .ctx "modo" .modo) }}
    </section>

    {{ partial "convivencia-casos/modales.html" .ctx }}
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="{{ "js/evidence-types.js" | relURL }}?v=2"></script>
  <script src="{{ "js/convivencia-casos.js" | relURL }}?v=2"></script>
  <script>
    (function () {
      'use strict';

      var API_BASE = {{ .ctx.Site.Params.apiBaseUrl | default "http://localhost:8080" | jsonify | safeJS }};
      var STORAGE_KEY = {{ .storageKey | jsonify | safeJS }};
      var STORAGE_USUARIO_KEY = {{ .storageUsuarioKey | jsonify | safeJS }};

      function $(id) { return document.getElementById(id); }

      function leerToken() {
        try { return sessionStorage.getItem(STORAGE_KEY) || ''; } catch (e) { return ''; }
      }

      function cerrarSesion(mensaje) {
        try {
          sessionStorage.removeItem(STORAGE_KEY);
          sessionStorage.removeItem(STORAGE_USUARIO_KEY);
        } catch (e) { /* almacenamiento no disponible */ }
        $('{{ .prefijo }}App').classList.add('hidden');
        $('{{ .prefijo }}Login').classList.remove('hidden');
        var alerta = $('{{ .prefijo }}LoginAlert');
        if (mensaje) {
          alerta.textContent = mensaje;
          alerta.classList.remove('hidden');
        } else {
          alerta.classList.add('hidden');
        }
      }

      function mostrarApp() {
        var usuario = {};
        try { usuario = JSON.parse(sessionStorage.getItem(STORAGE_USUARIO_KEY) || '{}'); } catch (e) { usuario = {}; }
        $('{{ .prefijo }}Usuario').textContent = usuario.nombreCompleto
          ? 'Bienvenido/a, ' + usuario.nombreCompleto + (usuario.cargo ? ' (' + usuario.cargo + ')' : '')
          : '';
        $('{{ .prefijo }}Login').classList.add('hidden');
        $('{{ .prefijo }}App').classList.remove('hidden');
        window.BVConvivenciaCasos.mostrar();
      }

      window.CONVIVENCIA_CASOS_CONFIG = window.CONVIVENCIA_CASOS_CONFIG || {};
      window.CONVIVENCIA_CASOS_CONFIG.obtenerToken = function () {
        var token = leerToken();
        return token ? Promise.resolve(token) : Promise.reject(new Error('Tu sesión terminó. Ingresa de nuevo.'));
      };
      window.CONVIVENCIA_CASOS_CONFIG.onNoAutorizado = function () {
        cerrarSesion('Tu sesión terminó o ya no tienes acceso {{ .alOrgano }}. Ingresa de nuevo.');
      };

      $('{{ .prefijo }}NumeroDocumento').addEventListener('input', function () {
        this.value = this.value.replace(/\s+/g, '').toUpperCase();
      });

      $('{{ .prefijo }}LoginForm').addEventListener('submit', function (event) {
        event.preventDefault();
        var numeroDocumento = $('{{ .prefijo }}NumeroDocumento').value.trim();
        if (!numeroDocumento) return;

        var boton = $('{{ .prefijo }}LoginBtn');
        boton.disabled = true;
        boton.innerHTML = '<span class="spinner-border spinner-border-sm me-2"></span>Ingresando…';
        $('{{ .prefijo }}LoginAlert').classList.add('hidden');

        fetch(API_BASE + '{{ .rutaLogin }}', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ numeroDocumento: numeroDocumento })
        }).then(function (response) {
          return response.json().catch(function () { return {}; }).then(function (body) {
            if (!response.ok) throw new Error((body.error && body.error.message) || 'No fue posible ingresar.');
            return body.data;
          });
        }).then(function (data) {
          sessionStorage.setItem(STORAGE_KEY, data.token);
          sessionStorage.setItem(STORAGE_USUARIO_KEY, JSON.stringify({
            nombreCompleto: data.nombreCompleto,
            cargo: data.cargo
          }));
          $('{{ .prefijo }}LoginForm').reset();
          mostrarApp();
        }).catch(function (error) {
          cerrarSesion(error.message);
        }).finally(function () {
          boton.disabled = false;
          boton.textContent = 'Ingresar';
        });
      });

      $('{{ .prefijo }}SalirBtn').addEventListener('click', function () { cerrarSesion(); });

      // Sesión guardada: entrar directo; si el token venció o el miembro fue desactivado,
      // la primera llamada responde 401 y onNoAutorizado vuelve al login.
      if (leerToken()) mostrarApp();
    }());
  </script>

  {{ partial "footer" .ctx }}
</body>

</html>
