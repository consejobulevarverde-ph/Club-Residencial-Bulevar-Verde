<div id="metrics" class="row g-3 mb-4"></div>

<div class="row g-4">
  <div class="col-xl-4">
    <div class="surface p-4">
      <h3 class="section-title h5">Buscar unidad o persona</h3>
      <form id="searchForm" class="input-group">
        <input
          id="query"
          class="form-control"
          placeholder="Código, placa, correo, documento o nombre" autocomplete="off">
        <button class="btn btn-primary">Buscar</button>
      </form>
      <div id="searchResults" class="mt-3 text-muted">Sin búsquedas todavía.</div>
    </div>
  </div>

  <div class="col-xl-8">
    <div class="surface p-4 sticky-xl-top sticky-panel">
      <h3 class="section-title h5">Detalle y edición de unidad</h3>
      <div id="profile">
        <p class="text-muted">
          Selecciona un resultado para consultar y actualizar el apartamento.
        </p>
      </div>
    </div>
  </div>
</div>
