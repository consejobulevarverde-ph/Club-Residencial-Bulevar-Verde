<style>
  .lector-placas-panel .lp-placa {
    display: inline-block;
    min-width: 11rem;
    padding: .3rem 1.1rem;
    background: #f7d117;
    color: #111;
    border: 3px solid #111;
    border-radius: .6rem;
    font-family: ui-monospace, monospace;
    font-size: 2.4rem;
    font-weight: 800;
    letter-spacing: .15em;
    text-align: center;
  }

  .lector-placas-panel .lp-vista {
    display: block;
    width: 100%;
    height: auto;
    border-radius: .75rem;
    border: 1px solid var(--b, #d8e6d9);
    background: #f5f7f5;
  }

  .lector-placas-panel .lp-vista.lp-marcando {
    touch-action: none;
    cursor: crosshair;
    outline: 3px dashed #198754;
    outline-offset: 2px;
  }

  .lector-placas-panel .lp-recorte {
    display: block;
    max-width: 100%;
    height: auto;
    border: 1px solid var(--b, #d8e6d9);
    border-radius: .5rem;
    background: #fff;
  }

  .lector-placas-panel .lp-input {
    font-family: ui-monospace, monospace;
    font-size: 1.3rem;
    font-weight: 700;
    letter-spacing: .1em;
  }

  .lector-placas-panel .lp-archivo {
    position: absolute;
    width: 1px;
    height: 1px;
    opacity: 0;
    pointer-events: none;
  }
</style>

<div class="lector-placas-panel">
  <div class="surface p-4 mb-4">
    <h3 class="section-title h5 mb-2"><i class="bi bi-upc-scan me-2"></i>Lector de placas</h3>
    <p class="small-note mb-3">
      Toma una foto del vehículo de frente o de espaldas, con la placa visible.
      La lectura se hace en este dispositivo; la foto no se envía ni se guarda.
    </p>

    <div class="d-flex flex-wrap gap-2 align-items-center">
      <label for="lpCamara" class="btn btn-primary btn-lg mb-0">
        <i class="bi bi-camera me-2"></i>Tomar foto
      </label>
      <input id="lpCamara" class="lp-archivo" type="file" accept="image/*" capture="environment">
      <label for="lpGaleria" class="btn btn-outline-secondary mb-0">
        <i class="bi bi-image me-1"></i>Elegir imagen
      </label>
      <input id="lpGaleria" class="lp-archivo" type="file" accept="image/*">
    </div>

    <div id="lpEstado" class="small-note mt-3 hidden" aria-live="polite">
      <span class="spinner-border spinner-border-sm me-2"></span><span id="lpEstadoTexto"></span>
    </div>
    <div id="lpAlert" class="alert mt-3 mb-0 hidden" aria-live="polite"></div>
  </div>

  <div id="lpResultado" class="surface p-4 mb-4 hidden">
    <div class="d-flex flex-wrap align-items-center gap-3 mb-3">
      <div id="lpPlaca" class="lp-placa">------</div>
      <div>
        <span id="lpTipo" class="badge text-bg-secondary me-1"></span>
        <span id="lpConfianza" class="badge"></span>
      </div>
    </div>

    <canvas id="lpRecorte" class="lp-recorte mb-3" width="1" height="1" aria-label="Recorte de la placa leída"></canvas>

    <label class="form-label" for="lpPlacaInput">Placa (puedes corregirla)</label>
    <div class="input-group mb-1" style="max-width:360px">
      <input id="lpPlacaInput" class="form-control lp-input text-uppercase" maxlength="6" autocomplete="off" placeholder="ABC123">
      <button id="lpCopiar" type="button" class="btn btn-outline-success">
        <i class="bi bi-clipboard me-1"></i>Copiar
      </button>
    </div>
    <div id="lpFormato" class="small mb-3"></div>

    <div id="lpAlternativasBox" class="hidden">
      <div class="small-note mb-1">Otras lecturas posibles:</div>
      <div id="lpAlternativas" class="d-flex flex-wrap gap-2"></div>
    </div>
  </div>

  <div id="lpFotoBox" class="surface p-4 hidden">
    <div class="d-flex flex-wrap justify-content-between align-items-center gap-2 mb-3">
      <span class="small-note" id="lpFotoAyuda">Foto analizada. El recuadro verde marca la placa leída.</span>
      <div class="d-flex flex-wrap gap-2">
        <button id="lpMarcar" type="button" class="btn btn-outline-secondary btn-sm">
          <i class="bi bi-bounding-box me-1"></i>Marcar placa
        </button>
        <button id="lpLeerSeleccion" type="button" class="btn btn-primary btn-sm" disabled>
          <i class="bi bi-upc-scan me-1"></i>Leer selección
        </button>
      </div>
    </div>
    <canvas id="lpVista" class="lp-vista" width="1" height="1" aria-label="Foto del vehículo"></canvas>
  </div>
</div>

<script>
  window.LECTOR_PLACAS_CONFIG = {
    vendorBase: {{ "vendor/tesseract/" | relURL | jsonify | safeJS }}
  };
</script>
<script src="{{ "js/lector-placas.js" | relURL }}?v=1"></script>
